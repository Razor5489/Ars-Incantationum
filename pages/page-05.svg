<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">FONDAMENTI</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Quattro elementi del controllo</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Preparare prima di eseguire</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Concentrazione</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Rivolgere l’attenzione al bersaglio e al risultato, riconoscendo ciò che può distrarre.</text><text x="52" y="245" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Volontà</text><text x="52" y="269" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Definire quale effetto si intende produrre, senza sostituire il progetto con una richiesta vaga</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">di maggiore potenza.</text><text x="52" y="324" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Movimento e formula</text><text x="52" y="348" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Coordinare il gesto appreso con la formula pronunciata chiaramente. Una variazione non</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">conosciuta non è un miglioramento dimostrato.</text><text x="52" y="403" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Predisposizione ed esercizio</text><text x="52" y="427" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">L’affinità con una pratica può facilitare l’apprendimento; non sostituisce preparazione,</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">costanza e riscontro del docente.</text><rect x="52" y="463" width="491" height="71" fill="#eee9d8"/><path d="M52 463v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="478" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">MAGIA INVOLONTARIA</text><text x="66" y="499" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Un fenomeno spontaneo non equivale a un’esecuzione intenzionale. Il corso sviluppa</text><text x="66" y="515" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">controllo, non la ricerca di manifestazioni incontrollate.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">05</text></svg>