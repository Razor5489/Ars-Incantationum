<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Confringo e Descendo · Applicazione</text><text x="52" y="140" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">guidata</text><text x="52" y="172" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Due effetti, due risultati distinti</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il terzo incontro applica soltanto le due formule già affrontate: Confringo e Descendo. Un</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">effetto esplosivo e una discesa rispondono a compiti differenti; la scelta deve partire dal</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">risultato necessario, non dalla ricerca della manifestazione più vistosa.</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La classe confronta un ostacolo da valutare e un oggetto da deporre su un appoggio. Si</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">descrivono bersaglio, persone esposte e conseguenze prima della dimostrazione. La</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">possibilità di scegliere una formula non dimostra che sia necessario usarla.</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La prova usa oggetti inanimati e condizioni predisposte dal docente. Si esamina un effetto</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">alla volta e si confronta il risultato con il progetto. L’incontro non introduce formule nuove</text><text x="52" y="376" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">o combinazioni con capacità aggiuntive.</text><rect x="52" y="394" width="491" height="55" fill="#eee9d8"/><path d="M52 394v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="409" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="430" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Riconoscere bersaglio, effetto e risultato necessario, rispettando le indicazioni del docente.</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Nathaniel Ashcombe · Appunti per il corso di Incantesimi</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">43</text></svg>