<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · LECTIO 3</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Ventus, Fumos e Nebulus · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Indicatore leggero e schema di un’area di osservazione.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Indica da dove deve arrivare il vento e dove deve terminare il suo compito.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Osserva Ventus sul bersaglio predisposto, registrando la direzione del movimento.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Risolvi un caso di visibilità ridotta indicando quali informazioni vengono perse.</text><rect x="52" y="314" width="491" height="71" fill="#eee9d8"/><path d="M52 314v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="329" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="350" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente riconosce che un ostacolo alla vista limita anche il controllo del proprio</text><text x="66" y="366" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">intervento.</text><text x="52" y="411" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="435" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Creare nebbia significa conoscere automaticamente ciò che essa nasconde?</text><text x="52" y="471" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="495" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. L’occultamento e la conoscenza delle posizioni sono capacità distinte.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">43</text></svg>