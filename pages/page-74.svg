<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Il programma dell’anno</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Due settimane · Quattro lezioni</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana I</text><!--ROW:4--><text x="60" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 1 · Alohomora · livello 3</text><text x="536" y="208" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">75</text><path d="M60 216H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="236" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Confrontare i tre livelli di apertura</text><!--ROW:6--><text x="60" y="263" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 2 · Silencio · revisione avanzata</text><text x="536" y="263" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">78</text><path d="M60 271H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Isolare il bersaglio nell’osservazione</text><text x="52" y="325" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana II</text><!--ROW:9--><text x="60" y="349" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 3 · Gli elementi · revisione</text><text x="536" y="349" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">80</text><path d="M60 357H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="377" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Incendio, Glacius e Ventus</text><!--ROW:11--><text x="60" y="404" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 4 · La magia non verbale</text><text x="536" y="404" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">82</text><path d="M60 412H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="432" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Studio teorico su formule già conosciute</text><rect x="52" y="447" width="491" height="55" fill="#eee9d8"/><path d="M52 447v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="462" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">TRAGUARDO</text><text x="66" y="483" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Studiare Alohomora di livello 3, precisione, continuità e preparazione non verbale.</text><text x="52" y="521" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Ogni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte</text><text x="52" y="539" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">74</text></svg>