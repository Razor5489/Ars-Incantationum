<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIO · DCAO</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Incarcerous</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula · Effetto e nozioni per la lezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76" font-style="italic">DCAO · Anno 5 · Settimana 2 · Riconoscimento teorico</text><text x="52" y="209" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Che cosa fa</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Evoca corde che avvolgono il bersaglio e ne limitano i movimenti.</text><text x="52" y="270" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Nozioni da spiegare</text><text x="52" y="294" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Evoca corde che avvolgono il bersaglio e ne limitano i movimenti. Il contenimento è</text><text x="52" y="312" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">distinto dallo sbilanciamento e dal disarmo: trattenere non significa automaticamente aver</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">concluso il pericolo.</text><text x="52" y="367" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Esempio da discutere in aula</text><text x="52" y="391" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Confrontare su disegno una gabbia ottenuta da un oggetto e funi apparse attorno a un</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">manichino. Ricostruire l’origine dei due effetti.</text><text x="52" y="446" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda alla classe</text><text x="52" y="470" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Incarcerous e Incarcifors producono lo stesso tipo di intervento?</text><rect x="52" y="487" width="491" height="55" fill="#eee9d8"/><path d="M52 487v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="502" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">RISPOSTA RAGIONATA</text><text x="66" y="523" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. Il primo evoca funi; il secondo trasforma materia presente in una gabbia.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">117</text></svg>