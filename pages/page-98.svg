<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">TAVOLA III · ALTRE DISCIPLINE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Materie e confini</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La competenza precede l’esecuzione</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Trasfigurazione</text><!--ROW:4--><text x="60" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Aguamenti</text><text x="536" y="208" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">I</text><path d="M60 216H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><!--ROW:5--><text x="60" y="236" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Engorgio</text><text x="536" y="236" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">IV</text><path d="M60 244H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><!--ROW:6--><text x="60" y="264" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Reducio</text><text x="536" y="264" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">IV</text><path d="M60 272H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><!--ROW:7--><text x="60" y="292" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Incarcerous</text><text x="536" y="292" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">V</text><path d="M60 300H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Medimagia</text><!--ROW:9--><text x="60" y="351" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Episkey</text><text x="536" y="351" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">III</text><path d="M60 359H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="386" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Formula da assegnare</text><text x="52" y="410" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Blink: funzione e materia non sono determinate dalla documentazione ricevuta. Non viene attribuito</text><text x="52" y="428" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">un anno né predisposta una lezione pratica.</text><text x="52" y="465" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Criterio editoriale</text><text x="52" y="489" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#283b32">Aguamenti conserva il primo anno di Trasfigurazione già stabilito. Gli altri anni non confermati sono proposte</text><text x="52" y="507" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#283b32">di ordinamento. Le denominazioni seguono il catalogo della scuola; le formule delle altre discipline non</text><text x="52" y="525" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#283b32">vengono impartite come Incantesimi.</text><text x="52" y="555" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Base teorica: Manuale Ufficiale di Incantesimi di bewitchedgdr. Catalogo aggiornato delle formule fornito dalla scuola.</text><text x="52" y="568" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76">Attività e piano didattico rielaborati per questa edizione.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">98</text></svg>