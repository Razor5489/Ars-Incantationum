<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Ventus</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Direzione e limite del vento</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Ventus produce un effetto di vento governato dalla bacchetta. La prova definisce una</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">direzione e un bersaglio che permettano di osservare il movimento senza coinvolgere</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">l’intero ambiente.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">L’intensità va riferita al compito: un indicatore che si muove nella direzione prevista offre</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">un riscontro più chiaro di materiali dispersi senza controllo.</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il laboratorio usa un oggetto inanimato leggero. Prima dell’esecuzione si controlla quali</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">altri elementi potrebbero essere coinvolti; l’esito va confrontato sia con il bersaglio sia con</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">ciò che doveva restare fermo.</text><rect x="52" y="345" width="491" height="55" fill="#eee9d8"/><path d="M52 345v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="360" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="381" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La direzione rispetta il progetto senza coinvolgere bersagli estranei.</text><text x="52" y="419" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Libro madre, p. 26.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">56</text></svg>