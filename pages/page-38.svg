<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · LECTIO 1</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Confringo</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula · Effetto e nozioni per la lezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76" font-style="italic">Incantesimi · Anno 3 · Settimana 1</text><text x="52" y="209" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Che cosa fa</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Provoca un’esplosione nel punto o sul bersaglio raggiunto dalla formula.</text><text x="52" y="270" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Nozioni da spiegare</text><text x="52" y="294" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Distinguere punto colpito e conseguenze nell’ambiente. La dimostrazione usa un bersaglio</text><text x="52" y="312" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">isolato e non autorizza prove sulle strutture della scuola.</text><text x="52" y="349" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Esempio da discutere in aula</text><text x="52" y="373" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Osservare la dimostrazione e confrontare scopo, bersaglio e materiali vicini.</text><text x="52" y="410" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda alla classe</text><text x="52" y="434" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Un’esplosione più vistosa dimostra un’esecuzione migliore?</text><rect x="52" y="451" width="491" height="71" fill="#eee9d8"/><path d="M52 451v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="466" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">RISPOSTA RAGIONATA</text><text x="66" y="487" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. Si giudicano corrispondenza con lo scopo, precisione e conseguenze, non la sola</text><text x="66" y="503" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">intensità.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">38</text></svg>