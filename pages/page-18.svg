<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Alohomora e Colloportus</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Apertura, chiusura e condizioni del bersaglio</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Alohomora agisce sull’apertura; Colloportus sulla chiusura. Sono formule da studiare sullo</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">stato concreto del bersaglio: una porta accostata, una serratura e una protezione magica non</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">rappresentano la stessa condizione.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il riferimento descrive limiti all’apertura quando il bersaglio è protetto da magia specifica.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Una mancata apertura non dimostra quindi automaticamente una cattiva pronuncia. Prima di</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">ripetere occorre riconoscere quale compito sia stato effettivamente assegnato.</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il laboratorio utilizza un contenitore didattico autorizzato. Il valore della prova sta</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">nell’osservare il passaggio fra gli stati, senza considerare la conoscenza di una formula un</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">permesso di accedere a qualsiasi luogo.</text><rect x="52" y="363" width="491" height="71" fill="#eee9d8"/><path d="M52 363v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="378" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="399" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente confronta gli stati del bersaglio e riconosce che l’apertura può incontrare limiti</text><text x="66" y="415" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">specifici.</text><text x="52" y="453" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: pp. 8–9.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">18</text></svg>