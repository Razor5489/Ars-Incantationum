<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · LECTIO 4</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Wingardium Leviosa</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula · Effetto e nozioni per la lezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76" font-style="italic">Lezione della materia</text><text x="52" y="209" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Che cosa fa</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Fa levitare un oggetto e permette di guidarne lo spostamento nello spazio fino a una</text><text x="52" y="251" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">deposizione controllata.</text><text x="52" y="288" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Nozioni da spiegare</text><text x="52" y="312" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La levitazione richiede di ragionare su altezza, traiettoria e appoggio finale. La precisione</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">cresce scegliendo punti di passaggio chiari, senza confondere il sollevamento con la sola</text><text x="52" y="348" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">spinta.</text><text x="52" y="385" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Esempio da discutere in aula</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Spostare una piuma tra due appoggi, passando sopra un segno sul banco. Far spiegare</text><text x="52" y="427" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">perché la fase di deposizione appartenga alla riuscita quanto il decollo.</text><text x="52" y="464" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda alla classe</text><text x="52" y="488" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Quali tre fasi devono essere controllate?</text><rect x="52" y="505" width="491" height="71" fill="#eee9d8"/><path d="M52 505v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="520" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">RISPOSTA RAGIONATA</text><text x="66" y="541" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Sollevare, guidare e deporre. Una traiettoria corretta che termina con una caduta non completa</text><text x="66" y="557" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">il compito.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">18</text></svg>