<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Puncheck</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Una voce del repertorio da descrivere prima della pratica</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Puncheck appartiene a Incantesimi nell’ordinamento della scuola ed è collocato nella</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">seconda settimana del secondo anno. I materiali disponibili non documentano ancora che</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">cosa produca la versione presente sul server. La materia e il calendario sono stabiliti;</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">l’effetto non viene inventato.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Senza una descrizione confermata non si assegnano alla formula bersaglio, movimento di</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">bacchetta, durata, intensità o proprietà particolari. Una somiglianza del nome con altre</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">parole non basta a ricostruire il funzionamento. Si distingue ciò che il programma stabilisce</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">da ciò che richiede un chiarimento.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">L’incontro è teorico: si prepara una scheda con le informazioni necessarie al docente per</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">completare la spiegazione. Una successiva dimostrazione dovrà essere preceduta dalla</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">descrizione effettiva della formula. Non vengono proposti esperimenti per scoprirne gli</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">effetti sui compagni.</text><rect x="52" y="417" width="491" height="55" fill="#eee9d8"/><path d="M52 417v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="432" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="453" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Distinguere assegnazione didattica ed effetto ancora da confermare.</text><text x="52" y="491" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Ordinamento didattico concordato della scuola · Hogwarts · 1890</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">32</text></svg>