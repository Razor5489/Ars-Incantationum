<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">DIDATTICA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Dal testo alla lezione</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Una formula, un effetto riconoscibile</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">1 · Spiegare il risultato</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Leggere la sezione «Che cosa fa» e far identificare bersaglio ed effetto. Prima della</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">formula, la classe deve saper dire quale cambiamento ci si aspetta.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">2 · Collegare una nozione</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Scegliere il confronto centrale della scheda: sospensione e guida, forma e consistenza, luce</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">e produzione del vento. Usare un esempio concreto per rendere visibile la differenza.</text><text x="52" y="342" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">3 · Osservare o discutere</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Svolgere l’attività prevista dalla lezione. Le voci delle altre materie e quelle di solo</text><text x="52" y="384" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">approfondimento restano confronti teorici, affidati al docente competente.</text><text x="52" y="421" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">4 · Chiedere una spiegazione</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Porre la domanda della scheda e chiedere una motivazione. La risposta ragionata aiuta a</text><text x="52" y="463" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">correggere un equivoco, senza sostituire la descrizione dello studente con la sola formula</text><text x="52" y="481" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">memorizzata.</text><rect x="52" y="499" width="491" height="71" fill="#eee9d8"/><path d="M52 499v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="514" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">LO STESSO CALENDARIO</text><text x="66" y="535" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Queste pagine sono materiali delle ventotto lezioni già previste: due incontri a settimana per</text><text x="66" y="551" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">due settimane in ciascuno dei sette anni.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">121</text></svg>