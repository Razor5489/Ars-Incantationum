<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">PRAEFATIO</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">La volontà e il metodo</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Prefazione di Nathaniel Ashcombe</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Un incantesimo comincia prima della formula. Il buon incantatore riconosce il bersaglio,</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">definisce un risultato e prepara il controllo con cui potrà giudicarlo. La volontà dà direzione</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">alla magia; il metodo rende leggibile il suo esito.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Questo volume accompagna sette annualità. Ogni anno si svolge in due settimane, con due</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">lezioni per settimana: quattro incontri prima di procedere all’anno successivo.</text><text x="52" y="298" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Il metodo comune</text><text x="52" y="322" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Le pagine teoriche introducono principi e formule. La scheda successiva organizza</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">preparazione, attività e controllo. Ogni incontro ha un obiettivo riconoscibile e termina con</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">una domanda ragionata.</text><rect x="52" y="376" width="491" height="55" fill="#eee9d8"/><path d="M52 376v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="391" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">LA SEQUENZA DI LAVORO</text><text x="66" y="412" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Osservare. Visualizzare. Eseguire con controllo. Confrontare. Correggere.</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">Questa edizione distingue le formule di Incantesimi da quelle delle altre discipline. Per le assegnazioni non</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">ancora stabilite, la tavola finale presenta una proposta didattica, non una regola già confermata.</text><text x="52" y="498" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La teoria non conferisce automaticamente abilità speciali. Gli argomenti avanzati si</text><text x="52" y="516" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">affrontano secondo la preparazione degli allievi e le indicazioni della scuola.</text><text x="52" y="546" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#153f33" font-style="italic">Nathaniel Ashcombe</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">02</text></svg>