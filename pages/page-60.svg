<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Silencio · revisione avanzata</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Isolare il bersaglio nell’osservazione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La revisione di Silencio precisa la relazione fra bersaglio e suoni dell’ambiente. Il risultato</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">non deve essere attribuito a soggetti che non sono stati coinvolti.</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La maggiore preparazione permette una descrizione più accurata del prima e del dopo. Il</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">silenzio momentaneo va distinto dal mancato tentativo di emettere un suono.</text><text x="52" y="273" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Si lavora su un caso di dimostrazione autorizzato. Il giudizio deve dichiarare se</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">l’osservazione è sufficiente o se occorre un ulteriore riscontro del docente.</text><rect x="52" y="309" width="491" height="55" fill="#eee9d8"/><path d="M52 309v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="324" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="345" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Il giudizio delimita bersaglio e portata dell’osservazione.</text><text x="52" y="383" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Revisione di Silencio; libro madre, p. 22.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">60</text></svg>