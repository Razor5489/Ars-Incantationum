<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">REPERTORIO · DA ASSEGNARE</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Blink</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula · Effetto e nozioni per la lezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76" font-style="italic">Da assegnare · anno da assegnare · Riconoscimento teorico</text><text x="52" y="209" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Che cosa fa</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il catalogo mostra questa denominazione ma non fornisce una descrizione dell’effetto.</text><text x="52" y="251" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Funzione, materia e anno rimangono da confermare.</text><text x="52" y="288" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Nozioni da spiegare</text><text x="52" y="312" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Non si identifica automaticamente la voce con teletrasporto o altre capacità. La scheda resta</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">documentale finché la scuola non ne precisa il funzionamento.</text><text x="52" y="367" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Esempio da discutere in aula</text><text x="52" y="391" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Confrontare la descrizione con una formula di Incantesimi già studiata. Individuare il</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">bersaglio e la differenza tra i due effetti. La voce serve al riconoscimento e non introduce</text><text x="52" y="427" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">un’esercitazione di questa materia.</text><text x="52" y="464" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda alla classe</text><text x="52" y="488" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Quale informazione bisogna conoscere prima di classificare o scegliere la formula?</text><rect x="52" y="505" width="491" height="71" fill="#eee9d8"/><path d="M52 505v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="520" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">RISPOSTA RAGIONATA</text><text x="66" y="541" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Il suo effetto e il bersaglio; quando la descrizione manca, occorre prima ottenerne conferma</text><text x="66" y="557" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">dal docente.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">118</text></svg>