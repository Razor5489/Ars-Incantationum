<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">APPENDICE · FONTI</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’ordine degli insegnamenti</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Le lezioni della scuola e il volume di riferimento</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Il primo anno</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il percorso conserva Lumos, Ferio, Verdimilius e Wingardium Leviosa fra le formule già</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">svolte. Periculum accompagna lo studio della segnalazione in un incontro condiviso con</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Difesa contro le Arti Oscure.</text><text x="52" y="281" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Il libro madre</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La base teorica è il «Manuale Ufficiale di Incantesimi» di bewitchedgdr. I contenuti sono</text><text x="52" y="323" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">rielaborati; l’organizzazione in quattro incontri annui è propria di questa edizione. Le</text><text x="52" y="341" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">pagine richiamate nelle schede consentono di ritrovare gli argomenti nel riferimento.</text><text x="52" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Edizione e attribuzione</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Ars Incantationum è il volume di Incantesimi di Edmund Valemont, preparato per</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">NightFall. Gli esercizi sono proposte didattiche originali. Le assegnazioni della scuola</text><text x="52" y="438" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">prevalgono sull’ordine del riferimento; gli argomenti avanzati non conferiscono abilità</text><text x="52" y="456" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">automatiche.</text><text x="52" y="486" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">Creato per NightFall da Razor. Progetto amatoriale, non ufficiale.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">77</text></svg>