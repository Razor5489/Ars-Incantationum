<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Il percorso di un oggetto</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Accio, Depulso, Descendo e Wingardium Leviosa</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Una situazione di movimento può richiedere richiamo, allontanamento, discesa o guida. La</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">scelta deve seguire il risultato necessario e non l’abitudine a usare sempre la stessa formula.</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il caso conclusivo presenta un oggetto fuori posto e una destinazione precisa. Prima di agire</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">si individua il percorso più leggibile e si scartano gli interventi superflui.</text><text x="52" y="273" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La quarta lezione conclude il terzo anno con una sequenza breve. Ogni effetto viene</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">osservato prima di passare al successivo; concatenare formule senza riscontro rende</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">difficile capire dove nasca un errore.</text><rect x="52" y="327" width="491" height="55" fill="#eee9d8"/><path d="M52 327v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="342" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="363" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La sequenza è proporzionata al compito e usa soltanto formule già studiate.</text><text x="52" y="401" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Catalogo delle formule della scuola; attività didattica proposta.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">34</text></svg>