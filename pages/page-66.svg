<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Arresto Momentum · Controllo</text><text x="52" y="140" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">avanzato</text><text x="52" y="172" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Ripresa della formula introdotta al terzo anno</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il quinto anno approfondisce Arresto Momentum già introdotto nel terzo. Lo studio non</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">aggiunge un nuovo potere: confronta momento dell’intervento, movimento del bersaglio e</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">precisione del risultato.</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il movimento si descrive prima del tentativo: direzione, punto di partenza e zona nella quale</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">verificare l’effetto rendono leggibile il confronto. La capacità di seguire il bersaglio conta</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">quanto la formula.</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La revisione usa casi più articolati e oggetti in movimento predisposti. L’esperienza</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">precedente non rende superflue preparazione e supervisione. Il rallentamento non equivale</text><text x="52" y="376" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">ad arrestare il tempo o a controllare ogni azione della persona.</text><rect x="52" y="394" width="491" height="55" fill="#eee9d8"/><path d="M52 394v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="409" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="430" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue rallentamento e arresto effettivo.</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Nathaniel Ashcombe · Appunti per il corso di Incantesimi</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">66</text></svg>