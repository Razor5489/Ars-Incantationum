<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Alohomora · livello 3</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Confrontare i tre livelli di apertura</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il livello 3 è la terza voce di Alohomora presente nel catalogo. Il suo studio riprende la</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">distinzione fra formula, condizioni della chiusura e risultato osservabile.</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">L’allievo ricostruisce i casi già affrontati prima di passare al bersaglio avanzato indicato dal</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">docente. La progressione non autorizza a definire ogni protezione equivalente a una</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">serratura ordinaria.</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La lezione conserva le condizioni effettivamente insegnate per il livello 3 e non aggiunge</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">caratteristiche mancanti. Anche un risultato positivo va riferito al bersaglio sul quale è stato</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">verificato.</text><rect x="52" y="345" width="491" height="55" fill="#eee9d8"/><path d="M52 345v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="360" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="381" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue i livelli senza estenderli a ogni protezione.</text><text x="52" y="419" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Catalogo della scuola, Alohomora (livello 3); libro madre, pp. 8–9.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">75</text></svg>