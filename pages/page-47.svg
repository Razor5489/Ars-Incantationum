<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · LECTIO 4</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Movimento e riparazione · Ripasso · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Tavole del bersaglio, oggetti comuni predisposti e schede di osservazione.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Descrivere il bersaglio e il risultato richiesto prima di scegliere la formula.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Confrontare le schede e la dimostrazione predisposta dal docente, rispettando i limiti della</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">lezione.</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Annotare il risultato e motivare quando interrompere l’esercizio.</text><rect x="52" y="331" width="491" height="71" fill="#eee9d8"/><path d="M52 331v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="346" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="367" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Distinguere effetto, bersaglio e condizioni dell’esercizio; rispettare il limite fra studio e</text><text x="66" y="383" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">pratica.</text><text x="52" y="428" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="452" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Che cosa deve essere definito prima dell’esercizio?</text><text x="52" y="488" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="512" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Bersaglio, risultato necessario e modo di verificare ciò che è accaduto.</text><text x="52" y="540" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#ac9258">Fine del ciclo di due settimane. Si prosegue con il IV anno.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">47</text></svg>