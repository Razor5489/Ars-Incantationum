<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Gli elementi · revisione</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Incendio, Glacius e Ventus</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il confronto riguarda tre effetti distinti: fiamma, freddo e vento. La scelta nasce dal compito</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">e non dall’idea che gli elementi possano sempre annullarsi fra loro.</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il progetto deve specificare bersaglio e limite di ciascuna prova. Non si concatenano effetti</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">sulla base della sola fantasia, né si inventano bonus risultanti dalla loro combinazione.</text><text x="52" y="273" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La classe analizza casi separati e una dimostrazione selezionata dal docente. Il riscontro più</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">importante è la coerenza fra l’intervento scelto e ciò che doveva essere ottenuto.</text><rect x="52" y="309" width="491" height="55" fill="#eee9d8"/><path d="M52 309v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="324" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="345" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo non attribuisce proprietà nuove alla semplice successione di incanti.</text><text x="52" y="383" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Revisione degli elementi; libro madre, pp. 26–27.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">62</text></svg>