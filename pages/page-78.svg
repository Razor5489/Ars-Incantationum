<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">TAVOLA II · D.C.A.O.</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Difesa contro le Arti Oscure</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Formule tenute fuori dal programma di Incantesimi</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">Protego, Flipendo e Rictusempra conservano il primo anno già assegnato. Per le altre voci, anno e materia</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">indicano una proposta didattica.</text><text x="60" y="225" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Protego</text><text x="536" y="225" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">I</text><path d="M60 233H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="253" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Flipendo</text><text x="536" y="253" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">I</text><path d="M60 261H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="281" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Rictusempra</text><text x="536" y="281" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">I</text><path d="M60 289H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="309" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Expelliarmus</text><text x="536" y="309" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">II</text><path d="M60 317H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="337" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Everte Statum</text><text x="536" y="337" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">II</text><path d="M60 345H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="365" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Tarantallegra</text><text x="536" y="365" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">II</text><path d="M60 373H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="393" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Petrificus</text><text x="536" y="393" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">III</text><path d="M60 401H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="421" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Colloshoo</text><text x="536" y="421" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">III</text><path d="M60 429H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="449" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Riddikulus</text><text x="536" y="449" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">III</text><path d="M60 457H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="477" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Expulso</text><text x="536" y="477" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">IV</text><path d="M60 485H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="505" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Confringo</text><text x="536" y="505" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">IV</text><path d="M60 513H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="533" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Confundo</text><text x="536" y="533" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">V</text><path d="M60 541H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="561" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Fireball</text><text x="536" y="561" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">V</text><path d="M60 569H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="589" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Obliviate</text><text x="536" y="589" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">VI</text><path d="M60 597H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="617" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Expecto Patronum</text><text x="536" y="617" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">VII</text><path d="M60 625H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="645" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">La presenza in questa tavola non costituisce insegnamento operativo della formula. Le lezioni appartengono</text><text x="52" y="663" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">alla materia indicata.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">78</text></svg>