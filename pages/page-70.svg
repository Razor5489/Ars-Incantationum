<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Homenum Revelio e Arresto</text><text x="52" y="140" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Momentum</text><text x="52" y="172" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Leggere una presenza, controllare un movimento</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Homenum Revelio riguarda l’individuazione di persone nell’area. Un’indicazione di</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">presenza non equivale alla conoscenza delle loro intenzioni o all’identificazione completa</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">di ciò che sta accadendo.</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Arresto Momentum interviene invece sulla velocità di un bersaglio. Il compito didattico usa</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">un oggetto dal movimento prevedibile, distinguendo il rallentamento osservato da un arresto</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">soltanto immaginato.</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Le formule vengono confrontate come esempi di giudizio avanzato: prima si riconosce</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">quale informazione serve o quale movimento si deve controllare, poi si sceglie il tipo</text><text x="52" y="376" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">d’intervento. Non si presume una copertura infallibile dell’ambiente.</text><rect x="52" y="394" width="491" height="55" fill="#eee9d8"/><path d="M52 394v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="409" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="430" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo separa rilevamento, interpretazione e modifica del movimento.</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: p. 53.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">70</text></svg>