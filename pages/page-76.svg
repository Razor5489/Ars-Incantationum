<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">LEXICON</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Il lessico dell’incantatore</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Parole da usare con precisione</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Bersaglio</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Soggetto identificato sul quale si intende intervenire.</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Formula e gesto</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Elementi appresi dell’esecuzione, da distinguere dal risultato osservato.</text><text x="52" y="304" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Controincantesimo</text><text x="52" y="328" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Intervento sull’effetto di un incanto. Non coincide con ogni effetto apparentemente opposto.</text><text x="52" y="364" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Incantamento</text><text x="52" y="388" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Progetto magico apposto a un oggetto, da verificare per compito e mantenimento.</text><text x="52" y="424" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Magia non verbale</text><text x="52" y="448" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Esecuzione senza formula pronunciata; richiede comunque intenzione e disciplina.</text><text x="52" y="484" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Riuscita e potenza</text><text x="52" y="508" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Un effetto più grande non è automaticamente più adatto. Conta la corrispondenza con il</text><text x="52" y="525" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">compito assegnato.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">76</text></svg>