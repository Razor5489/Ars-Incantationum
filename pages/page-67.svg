<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO V · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Accio e Depulso · revisione</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Scegliere il movimento più adatto</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La revisione confronta richiamo e allontanamento sullo stesso oggetto in due prove distinte.</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il progetto deve mantenere espliciti origine, percorso e destinazione.</text><text x="52" y="225" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La maggiore preparazione non richiede una maggiore intensità: permette invece di motivare</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">meglio quale delle due formule sia sufficiente al compito.</text><text x="52" y="273" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">I tentativi restano separati. Si attende il riscontro del primo prima di predisporre il secondo,</text><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">così che una deviazione non venga nascosta da un intervento successivo.</text><rect x="52" y="309" width="491" height="55" fill="#eee9d8"/><path d="M52 309v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="324" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="345" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La scelta è motivata dal percorso e dalla destinazione.</text><text x="52" y="383" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Revisione di Accio e Depulso; libro madre, pp. 13–14.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">67</text></svg>