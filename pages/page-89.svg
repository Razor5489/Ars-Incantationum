<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Wingardium Leviosa · revisione</text><text x="52" y="140" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">avanzata</text><text x="52" y="172" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Un percorso preciso, senza scorciatoie</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La guida avanzata riprende Wingardium Leviosa su un percorso più articolato predisposto</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">dal docente. La difficoltà cresce nella precisione richiesta, non in un aumento arbitrario dei</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">poteri della formula.</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il progetto conserva punti di passaggio, appoggi e destinazione. L’allievo deve scegliere</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">quando correggere la traiettoria e quando interrompere una prova che non rispetta il</text><text x="52" y="310" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">compito.</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Non si estende la riuscita a persone o creature. Il confronto resta legato all’oggetto e alle</text><text x="52" y="358" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">condizioni realmente affrontate durante l’esercitazione.</text><rect x="52" y="376" width="491" height="55" fill="#eee9d8"/><path d="M52 376v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="391" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="412" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Il percorso è rispettato e le correzioni mantengono il controllo.</text><text x="52" y="450" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Libro madre, pp. 9–10; approfondimento didattico.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">89</text></svg>