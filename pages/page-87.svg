<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Arresto Momentum · revisione</text><text x="52" y="140" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">avanzata</text><text x="52" y="172" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Leggere il movimento prima di intervenire</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La revisione introduce un caso più articolato di movimento, mantenendo un solo bersaglio</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">inanimato. L’obiettivo è descrivere con prontezza il cambiamento di velocità.</text><text x="52" y="256" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La scelta del momento deve essere motivata rispetto al percorso. La maggiore complessità</text><text x="52" y="274" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">non consiste nell’attribuire alla formula poteri nuovi, ma nel controllare meglio le</text><text x="52" y="292" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">condizioni della prova.</text><text x="52" y="322" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il caso si conclude confrontando il rallentamento osservato con il risultato previsto. Solo il</text><text x="52" y="340" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">docente stabilisce se la preparazione consenta ulteriori applicazioni.</text><rect x="52" y="358" width="491" height="55" fill="#eee9d8"/><path d="M52 358v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="373" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="394" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La previsione del movimento è coerente e verificabile.</text><text x="52" y="432" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Nathaniel Ashcombe · Appunti per il corso di Incantesimi</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">87</text></svg>