<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Accio e Levioso</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Richiamare e sospendere: due effetti distinti</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Accio richiama verso l’incantatore l’oggetto identificato; Levioso lo solleva e lo mantiene</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">sospeso secondo le condizioni dell’esecuzione. Il primo riguarda un movimento verso una</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">destinazione, il secondo una condizione di sospensione. Una formula non diventa</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">automaticamente l’altra.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Prima si descrivono i due effetti separatamente. Il richiamo richiede un bersaglio</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">riconoscibile e un percorso considerato; la sospensione va distinta dalla conduzione libera</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">di Wingardium Leviosa. La posizione visibile non permette da sola di capire quale</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">intervento sia stato compiuto.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Le due schede di formula appartengono a questo stesso incontro della prima settimana. Il</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">docente mostra i risultati su oggetti preparati. La classe confronta posizione iniziale,</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">direzione e posizione finale, senza concatenare automaticamente le formule come se fossero</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">una nuova magia.</text><rect x="52" y="417" width="491" height="55" fill="#eee9d8"/><path d="M52 417v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="432" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="453" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Distinguere richiamo, sospensione e guida del bersaglio.</text><text x="52" y="491" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Ordinamento didattico concordato della scuola · Hogwarts · 1890</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">21</text></svg>