<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#06271b"/><stop offset=".12" stop-color="#17583a"/><stop offset=".6" stop-color="#0c402a"/><stop offset="1" stop-color="#042015"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 2 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Arresto Momentum</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Osservare un rallentamento</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Arresto Momentum interviene sulla velocità di un bersaglio. Il compito iniziale riguarda un</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">oggetto dal percorso prevedibile e richiede di distinguere il rallentamento osservato</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">dall’arresto soltanto immaginato.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il movimento si descrive prima del tentativo: direzione, punto di partenza e zona nella quale</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">verificare l’effetto rendono leggibile il confronto. La capacità di seguire il bersaglio conta</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">quanto la formula.</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Le applicazioni più complesse verranno riprese negli anni successivi. La prova di oggi non</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">estende automaticamente il controllo a persone, creature o più oggetti in movimento.</text><rect x="52" y="345" width="491" height="55" fill="#eee9d8"/><path d="M52 345v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="360" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="381" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue rallentamento e arresto effettivo.</text><text x="52" y="419" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: Nathaniel Ashcombe · Appunti per il corso di Incantesimi</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">40</text></svg>