<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS INCANTATIONUM</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · LECTIO 3</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Levioso</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La formula · Effetto e nozioni per la lezione</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#8e8a76" font-style="italic">Lezione della materia</text><text x="52" y="209" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Che cosa fa</text><text x="52" y="233" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Solleva e mantiene sospeso il bersaglio secondo l’effetto mostrato dal docente. La</text><text x="52" y="251" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">sospensione lo separa dall’appoggio senza implicare una guida libera lungo un percorso.</text><text x="52" y="288" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Nozioni da spiegare</text><text x="52" y="312" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Sollevamento, sospensione e spostamento sono momenti diversi. Osservare l’altezza non</text><text x="52" y="330" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">basta: conta anche riconoscere se il bersaglio rimane nella posizione prevista.</text><text x="52" y="367" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Esempio da discutere in aula</text><text x="52" y="391" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Usare un oggetto leggero. Disegnare sulla scheda la posizione iniziale e quella sospesa,</text><text x="52" y="409" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">quindi confrontare l’effetto con Wingardium Leviosa.</text><text x="52" y="446" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda alla classe</text><text x="52" y="470" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Un oggetto sospeso è necessariamente guidato verso una destinazione?</text><rect x="52" y="487" width="491" height="71" fill="#eee9d8"/><path d="M52 487v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="502" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">RISPOSTA RAGIONATA</text><text x="66" y="523" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. La sospensione descrive una condizione; la conduzione richiede il controllo di una</text><text x="66" y="539" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">traiettoria.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI INCANTESIMI</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">15</text></svg>