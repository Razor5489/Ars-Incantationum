<script id="book-data" type="application/json">{"pages": [{"image": "pages/page-01.svg", "text": "ARS INCANTATIONUM\nTractatus de Arte Incantatoria\nEdmund Valemont\nHogwarts · 1890", "title": "Copertina", "folio": "Copertina", "kind": "cover"}, {"image": "pages/page-02.svg", "text": "ARS INCANTATIONUM\nPraefatio\nLa volontà e il metodo\nPrefazione di Edmund Valemont\nUn incantesimo comincia prima della formula. Il buon incantatore riconosce il bersaglio, definisce un risultato e prepara il controllo con cui potrà giudicarlo. La volontà dà direzione alla magia; il metodo rende leggibile il suo esito.\nQuesto volume accompagna sette annualità. Ogni anno si svolge in due settimane, con due lezioni per settimana: quattro incontri prima di procedere all’anno successivo.\nIl metodo comune\nLe pagine teoriche introducono principi e formule. La scheda successiva organizza preparazione, attività e controllo. Ogni incontro ha un obiettivo riconoscibile e termina con una domanda ragionata.\nLa sequenza di lavoro\nOsservare. Visualizzare. Eseguire con controllo. Confrontare. Correggere.\nQuesta edizione distingue le formule di Incantesimi da quelle delle altre discipline. Per le assegnazioni non ancora stabilite, la tavola finale presenta una proposta didattica, non una regola già confermata.\nLa teoria non conferisce automaticamente abilità speciali. Gli argomenti avanzati si affrontano secondo la preparazione degli allievi e le indicazioni della scuola.\nEdmund Valemont", "title": "La volontà e il metodo", "folio": "02", "kind": "theory"}, {"image": "pages/page-03.svg", "text": "ARS INCANTATIONUM\nTabula Materiarum\nIndice del volume\nSette anni, un solo metodo.\nPrefazione 02\nIl percorso delle due settimane 04\nFondamenti degli Incantesimi 05\nAnno I · Luce e sospensione 06\nAnno II · Accesso e recupero 16\nAnno III · Direzione, velocità e suono 26\nAnno IV · Gli elementi e la precisione 36\nAnno V · Controllo intermedio 46\nAnno VI · Controllo avanzato 56\nAnno VII · Il giudizio dell’incantatore 66\nLessico essenziale 76\nIncantesimi · Tavola per anno 77\nDifesa contro le Arti Oscure 78\nAltre materie e assegnazioni 79\nFinis 80\nL’indice ricercabile permette di trovare anche una singola formula. Le linguette laterali aprono le annualità. Una pagina può essere segnata e ritrovata nello stesso browser.", "title": "Indice del volume", "folio": "03", "kind": "theory"}, {"image": "pages/page-04.svg", "text": "ARS INCANTATIONUM\nCursus Septem Annorum\nDue settimane per anno\nIl ritmo didattico del volume\nSettimana I\nLezione 1: principi e osservazione. Lezione 2: sviluppo e confronto. Ogni incontro presenta una pratica centrale o un caso da interpretare.\nSettimana II\nLezione 3: applicazione guidata. Lezione 4: sintesi e ripasso. Concluso il quarto incontro, si prosegue con la prima lezione dell’anno successivo.\nQuindici minuti\n2 minuti per obiettivo e preparazione; 3 per la lettura guidata; 7 per attività o dimostrazione; 3 per confronto e ripasso.\nConoscenza e applicazione\nIl programma conserva nome, materia e anno delle formule documentate dalla scuola. Le attività del libro accompagnano l’insegnamento senza inventare meccaniche, durate o potenziamenti.\nLe lezioni mancanti possono essere recuperate consultando teoria e scheda operativa. Non è previsto un esame finale.", "title": "Due settimane per anno", "folio": "04", "kind": "theory"}, {"image": "pages/page-05.svg", "text": "ARS INCANTATIONUM\nFondamenti\nQuattro elementi del controllo\nPreparare prima di eseguire\nConcentrazione\nRivolgere l’attenzione al bersaglio e al risultato, riconoscendo ciò che può distrarre.\nVolontà\nDefinire quale effetto si intende produrre, senza sostituire il progetto con una richiesta vaga di maggiore potenza.\nMovimento e formula\nCoordinare il gesto appreso con la formula pronunciata chiaramente. Una variazione non conosciuta non è un miglioramento dimostrato.\nPredisposizione ed esercizio\nL’affinità con una pratica può facilitare l’apprendimento; non sostituisce preparazione, costanza e riscontro del docente.\nMagia involontaria\nUn fenomeno spontaneo non equivale a un’esecuzione intenzionale. Il corso sviluppa controllo, non la ricerca di manifestazioni incontrollate.", "title": "Quattro elementi del controllo", "folio": "05", "kind": "theory"}, {"image": "pages/page-06.svg", "text": "ARS INCANTATIONUM\nAnno I\nLuce e sospensione\nAnnus Primus\nConsolidare Lumos, Verdimilius, Levioso e Wingardium Leviosa: effetti distinti, un solo metodo di controllo.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.\nLumos, Verdimilius, Levioso e Wingardium Leviosa.", "title": "Luce e sospensione", "folio": "06", "kind": "divider"}, {"image": "pages/page-07.svg", "text": "ARS INCANTATIONUM\nAnno I\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Lumos 08\nIlluminare con intenzione\nLezione 2 · Verdimilius 10\nScintille verdi e direzione\nSettimana II\nLezione 3 · Levioso 12\nSospensione e differenza dalla levitazione guidata\nLezione 4 · Wingardium Leviosa 14\nSollevare, guidare, deporre\nTraguardo\nConsolidare Lumos, Verdimilius, Levioso e Wingardium Leviosa: effetti distinti, un solo metodo di controllo.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "07", "kind": "theory"}, {"image": "pages/page-08.svg", "text": "ARS INCANTATIONUM\nAnno I · Settimana I\nLumos\nIlluminare con intenzione\nLumos produce luce sulla punta della bacchetta. Il compito iniziale consiste nel rendere riconoscibile un oggetto o una porzione di testo, mantenendo l’intensità adatta alla situazione.\nConcentrazione, volontà, movimento e predisposizione sono i quattro elementi discussi dal riferimento. La predisposizione non sostituisce l’esercizio. La formula pronunciata con chiarezza accompagna un’intenzione definita e un gesto appreso nella dimostrazione.\nIl primo incontro riprende l’incanto già studiato. Si osservano avvio e continuità della luce, senza attribuirle proprietà ulteriori soltanto perché la bacchetta si illumina. Il docente guida la conclusione della prova secondo le modalità apprese in aula.\nObiettivo\nLa luce rende riconoscibile il bersaglio e rimane adeguata al compito.\nRiferimento: Libro madre, pp. 7–8; formula già svolta nel primo anno.", "title": "Lumos", "folio": "08", "kind": "theory"}, {"image": "pages/page-09.svg", "text": "ARS INCANTATIONUM\nAnno I · Lectio 1\nL’esercizio e il giudizio\nLumos · Scheda operativa\nPreparazione\nBacchetta, testo da illuminare e area di lavoro predisposta.\n1. Definisci quale riga o oggetto deve essere visibile.\n2. Esegui Lumos secondo la dimostrazione e mantieni il compito assegnato.\n3. Concludi la prova con il docente e registra la regolarità della luce.\nControllo\nLa luce rende riconoscibile il bersaglio e rimane adeguata al compito.\nDomanda di ripasso\nLa massima luminosità è sempre il risultato migliore?\nRagionamento\nNo. La riuscita dipende dall’illuminazione necessaria e dal controllo, non dalla sola intensità.", "title": "Lumos · Esercizio e ripasso", "folio": "09", "kind": "theory"}, {"image": "pages/page-10.svg", "text": "ARS INCANTATIONUM\nAnno I · Settimana I\nVerdimilius\nScintille verdi e direzione\nVerdimilius riprende lo studio delle scintille verdi già affrontato nella scuola. Il colore è un elemento osservabile dell’effetto, ma da solo non dimostra ogni applicazione possibile della formula.\nLa prova elementare definisce un bersaglio e una direzione. L’allievo deve conservare un’intenzione chiara e distinguere il risultato osservato dalle interpretazioni che non sono state verificate.\nLe applicazioni ulteriori descritte dal riferimento non vengono attribuite automaticamente al primo tentativo. La lezione consolida la manifestazione già appresa, senza introdurre varianti non comprese nel programma.\nObiettivo\nLo studente controlla la direzione senza attribuire proprietà ulteriori a una manifestazione luminosa.\nRiferimento: Libro madre, p. 22; grafia e collocazione seguono le lezioni della scuola.", "title": "Verdimilius", "folio": "10", "kind": "theory"}, {"image": "pages/page-11.svg", "text": "ARS INCANTATIONUM\nAnno I · Lectio 2\nL’esercizio e il giudizio\nVerdimilius · Scheda operativa\nPreparazione\nArea di dimostrazione e bersaglio inanimato predisposto.\n1. Descrivi colore, direzione e compito dell’effetto.\n2. Riprendi Verdimilius limitandoti alla prova indicata dal docente.\n3. Confronta il risultato con il progetto e segnala soltanto ciò che hai osservato.\nControllo\nLo studente controlla la direzione senza attribuire proprietà ulteriori a una manifestazione luminosa.\nDomanda di ripasso\nIl colore verde basta a dimostrare una capacità di rivelazione?\nRagionamento\nNo. Colore e applicazione devono essere distinti; una proprietà ulteriore richiede un riscontro.", "title": "Verdimilius · Esercizio e ripasso", "folio": "11", "kind": "theory"}, {"image": "pages/page-12.svg", "text": "ARS INCANTATIONUM\nAnno I · Settimana II\nLevioso\nSospensione e differenza dalla levitazione guidata\nLevioso introduce la sospensione di un bersaglio. Il risultato va osservato prima di confrontarlo con altre formule: vedere un oggetto sollevato non significa averne governato anche una traiettoria.\nWingardium Leviosa verrà ripreso nell’incontro successivo per il movimento guidato. L’accostamento serve a distinguere il mantenimento in sospensione dalla conduzione verso una destinazione scelta.\nLa pratica usa un solo oggetto leggero e una posizione concordata. Le modalità effettive e i limiti della formula vengono appresi nella dimostrazione; non si inventano tempi, distanze o potenziamenti.\nObiettivo\nL’allievo distingue sospensione e movimento diretto.\nRiferimento: Catalogo della scuola; confronto teorico con il libro madre, pp. 9–10.", "title": "Levioso", "folio": "12", "kind": "theory"}, {"image": "pages/page-13.svg", "text": "ARS INCANTATIONUM\nAnno I · Lectio 3\nL’esercizio e il giudizio\nLevioso · Scheda operativa\nPreparazione\nOggetto leggero e punto di osservazione predisposto.\n1. Identifica il bersaglio e la posizione prevista.\n2. Osserva o esegui Levioso sotto guida.\n3. Descrivi ciò che resta sospeso e ciò che non hai ancora dimostrato di poter guidare.\nControllo\nL’allievo distingue sospensione e movimento diretto.\nDomanda di ripasso\nUn oggetto sospeso ha necessariamente seguito un percorso scelto da te?\nRagionamento\nNo. Sollevamento, sospensione e guida sono aspetti da verificare separatamente.", "title": "Levioso · Esercizio e ripasso", "folio": "13", "kind": "theory"}, {"image": "pages/page-14.svg", "text": "ARS INCANTATIONUM\nAnno I · Settimana II\nWingardium Leviosa\nSollevare, guidare, deporre\nWingardium Leviosa permette di far levitare un oggetto e guidarlo nello spazio. Il primo bersaglio deve essere semplice e leggero: una traiettoria breve e verificabile è più utile di un sollevamento appariscente ma poco controllato.\nLa levitazione non coincide con qualunque movimento. Locomotor verrà studiato per lo spostamento degli oggetti; Wingardium Leviosa richiede invece di governare sospensione, direzione e deposizione. Il percorso si prepara prima dell’esecuzione.\nLa quarta lezione riunisce Lumos, Verdimilius, Levioso e Wingardium Leviosa. Sono effetti diversi che richiedono un’intenzione riconoscibile. La conclusione delle due settimane prepara al secondo anno, conservando le schede del primo per il ripasso.\nObiettivo\nIl bersaglio viene sollevato, guidato e deposto senza perdere la corrispondenza con il progetto.\nRiferimento: pp. 9–10; formula già svolta nel primo anno della scuola.", "title": "Wingardium Leviosa", "folio": "14", "kind": "theory"}, {"image": "pages/page-15.svg", "text": "ARS INCANTATIONUM\nAnno I · Lectio 4\nL’esercizio e il giudizio\nWingardium Leviosa · Scheda operativa\nPreparazione\nPiuma o oggetto leggero, due punti di appoggio e percorso libero.\n1. Descrivi partenza, altezza concordata e punto di arrivo.\n2. Solleva l’oggetto con Wingardium Leviosa e segui una traiettoria semplice.\n3. Deponilo nel punto previsto; confronta un esito controllato con uno soltanto spettacolare.\nControllo\nIl bersaglio viene sollevato, guidato e deposto senza perdere la corrispondenza con il progetto.\nDomanda di ripasso\nIl bersaglio sale molto in alto ma non arriva dove previsto: il risultato è efficace?\nRagionamento\nNon rispetto al compito assegnato. L’altezza non sostituisce direzione e controllo della deposizione.\nFine del ciclo di due settimane. Si prosegue con il II anno.", "title": "Wingardium Leviosa · Esercizio e ripasso", "folio": "15", "kind": "theory"}, {"image": "pages/page-16.svg", "text": "ARS INCANTATIONUM\nAnno II\nAccesso e recupero\nAnnus Secundus\nStudiare apertura, chiusura, richiamo, allontanamento e riparazione su bersagli ordinari.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Accesso e recupero", "folio": "16", "kind": "divider"}, {"image": "pages/page-17.svg", "text": "ARS INCANTATIONUM\nAnno II\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Alohomora e Colloportus 18\nApertura di base e chiusura\nLezione 2 · Accio 20\nRichiamo e destinazione\nSettimana II\nLezione 3 · Depulso 22\nAllontanare con un limite\nLezione 4 · Reparo 24\nRicostruire senza inventare\nTraguardo\nStudiare apertura, chiusura, richiamo, allontanamento e riparazione su bersagli ordinari.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "17", "kind": "theory"}, {"image": "pages/page-18.svg", "text": "ARS INCANTATIONUM\nAnno II · Settimana I\nAlohomora e Colloportus\nApertura di base e chiusura\nAlohomora agisce sull’apertura; Colloportus sulla chiusura. Sono formule da studiare sullo stato concreto del bersaglio: una porta accostata, una serratura e una protezione magica non rappresentano la stessa condizione.\nIl riferimento descrive limiti all’apertura quando il bersaglio è protetto da magia specifica. Una mancata apertura non dimostra quindi automaticamente una cattiva pronuncia. Prima di ripetere occorre riconoscere quale compito sia stato effettivamente assegnato.\nIl laboratorio utilizza un contenitore didattico autorizzato. Il valore della prova sta nell’osservare il passaggio fra gli stati, senza considerare la conoscenza di una formula un permesso di accedere a qualsiasi luogo.\nObiettivo\nLo studente confronta gli stati del bersaglio e riconosce che l’apertura può incontrare limiti specifici.\nRiferimento: Libro madre, pp. 8–9; Alohomora di base nel catalogo della scuola.", "title": "Alohomora e Colloportus", "folio": "18", "kind": "theory"}, {"image": "pages/page-19.svg", "text": "ARS INCANTATIONUM\nAnno II · Lectio 1\nL’esercizio e il giudizio\nAlohomora e Colloportus · Scheda operativa\nPreparazione\nContenitore didattico e scheda dello stato iniziale.\n1. Descrivi il meccanismo o la chiusura preparati dal docente.\n2. Osserva Colloportus e il successivo intervento di Alohomora sullo stesso bersaglio.\n3. Distingui mancata esecuzione e presenza di una condizione che richieda un altro intervento.\nControllo\nLo studente confronta gli stati del bersaglio e riconosce che l’apertura può incontrare limiti specifici.\nDomanda di ripasso\nAlohomora non apre una chiusura protetta: sai già quale sia la causa?\nRagionamento\nNo. Bisogna verificare protezione, bersaglio e condizioni dell’esercizio prima di attribuire l’esito alla formula.", "title": "Alohomora e Colloportus · Esercizio e ripasso", "folio": "19", "kind": "theory"}, {"image": "pages/page-20.svg", "text": "ARS INCANTATIONUM\nAnno II · Settimana I\nAccio\nRichiamo e destinazione\nAccio richiama un oggetto identificato verso una destinazione. Il lavoro parte da un bersaglio visibile e da un percorso libero: conoscere il nome della formula non basta a riconoscere ciò che si intende richiamare.\nLa preparazione precisa oggetto, posizione iniziale e punto di arrivo. Il riferimento consiglia un’immagine mentale chiara; la prova di base mantiene il bersaglio osservabile per poter confrontare il percorso con il progetto.\nDepulso sarà affrontato nell’incontro successivo per l’allontanamento. Prima si consolida il richiamo di un singolo oggetto, senza attribuire alla riuscita una capacità illimitata di ricerca.\nObiettivo\nIl richiamo corrisponde al bersaglio e alla destinazione scelti.\nRiferimento: Libro madre, p. 13.", "title": "Accio", "folio": "20", "kind": "theory"}, {"image": "pages/page-21.svg", "text": "ARS INCANTATIONUM\nAnno II · Lectio 2\nL’esercizio e il giudizio\nAccio · Scheda operativa\nPreparazione\nOggetto leggero, zona di raccolta e percorso sgombro.\n1. Identifica un solo oggetto e il suo punto di partenza.\n2. Richiamalo con Accio verso una zona concordata.\n3. Confronta il punto raggiunto con quello previsto.\nControllo\nIl richiamo corrisponde al bersaglio e alla destinazione scelti.\nDomanda di ripasso\nRicordare la formula basta a identificare un oggetto sconosciuto?\nRagionamento\nNo. L’identificazione del bersaglio fa parte della preparazione.", "title": "Accio · Esercizio e ripasso", "folio": "21", "kind": "theory"}, {"image": "pages/page-22.svg", "text": "ARS INCANTATIONUM\nAnno II · Settimana II\nDepulso\nAllontanare con un limite\nDepulso allontana il bersaglio mediante una spinta magica. È un effetto opposto al richiamo, ma questo non lo rende automaticamente un mezzo per annullare qualunque esecuzione di Accio.\nIl punto d’arrivo va definito prima del tentativo. Una spinta più intensa non è una prova migliore se il compito consiste nel collocare l’oggetto entro una zona limitata.\nLa pratica distingue direzione, percorso ed esito. Non si considerano equivalenti il movimento contrario e la cessazione di un incanto: il confronto deve seguire ciò che è effettivamente osservabile.\nObiettivo\nLa spinta rispetta la destinazione concordata.\nRiferimento: Libro madre, pp. 13–14.", "title": "Depulso", "folio": "22", "kind": "theory"}, {"image": "pages/page-23.svg", "text": "ARS INCANTATIONUM\nAnno II · Lectio 3\nL’esercizio e il giudizio\nDepulso · Scheda operativa\nPreparazione\nOggetto leggero e zona di arrivo libera.\n1. Definisci origine e destinazione del bersaglio.\n2. Esegui Depulso secondo la dimostrazione del docente.\n3. Confronta direzione e distanza ottenute con il progetto.\nControllo\nLa spinta rispetta la destinazione concordata.\nDomanda di ripasso\nUn movimento opposto è sempre un controincantesimo?\nRagionamento\nNo. Muovere in senso contrario non equivale ad annullare l’effetto magico.", "title": "Depulso · Esercizio e ripasso", "folio": "23", "kind": "theory"}, {"image": "pages/page-24.svg", "text": "ARS INCANTATIONUM\nAnno II · Settimana II\nReparo\nRicostruire senza inventare\nReparo ricompone un oggetto danneggiato. La preparazione parte dal riconoscimento della sua struttura originaria: i frammenti presenti devono corrispondere a un insieme conoscibile, non a una forma immaginata senza riferimento.\nIl manuale distingue la ricomposizione materiale dalla restituzione di ogni proprietà magica. Un manufatto complesso o una bacchetta non possono essere giudicati soltanto dall’aspetto esterno. Una superficie integra non dimostra il recupero delle funzioni nascoste.\nL’esercizio conclude il secondo anno su un oggetto ordinario e documentato prima del danno. Reparo non viene presentato come cura per esseri viventi né come soluzione universale: il giudizio finale deve esplicitare ciò che è stato effettivamente verificato.\nObiettivo\nLa ricostruzione corrisponde al riferimento e il giudizio non promette il recupero di poteri non osservabili.\nRiferimento: pp. 15–16.", "title": "Reparo", "folio": "24", "kind": "theory"}, {"image": "pages/page-25.svg", "text": "ARS INCANTATIONUM\nAnno II · Lectio 4\nL’esercizio e il giudizio\nReparo · Scheda operativa\nPreparazione\nOggetto semplice predisposto in frammenti e disegno della forma originaria.\n1. Confronta i frammenti con il disegno e individua le parti da ricomporre.\n2. Osserva o esegui Reparo secondo la dimostrazione.\n3. Controlla forma e funzione ordinaria, separandole da proprietà che non hai verificato.\nControllo\nLa ricostruzione corrisponde al riferimento e il giudizio non promette il recupero di poteri non osservabili.\nDomanda di ripasso\nUn oggetto incantato torna integro alla vista: hai dimostrato che ogni suo incanto funziona?\nRagionamento\nNo. La ricomposizione visibile non dimostra il ripristino di tutte le proprietà magiche.\nFine del ciclo di due settimane. Si prosegue con il III anno.", "title": "Reparo · Esercizio e ripasso", "folio": "25", "kind": "theory"}, {"image": "pages/page-26.svg", "text": "ARS INCANTATIONUM\nAnno III\nDirezione, velocità e suono\nAnnus Tertius\nGovernare Descendo, Arresto Momentum e Silencio, collegandoli agli incanti di movimento già conosciuti.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Direzione, velocità e suono", "folio": "26", "kind": "divider"}, {"image": "pages/page-27.svg", "text": "ARS INCANTATIONUM\nAnno III\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Descendo 28\nLa direzione verso il basso\nLezione 2 · Arresto Momentum 30\nOsservare un rallentamento\nSettimana II\nLezione 3 · Silencio 32\nIl silenziamento e il suo bersaglio\nLezione 4 · Il percorso di un oggetto 34\nAccio, Depulso, Descendo e Wingardium Leviosa\nTraguardo\nGovernare Descendo, Arresto Momentum e Silencio, collegandoli agli incanti di movimento già conosciuti.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "27", "kind": "theory"}, {"image": "pages/page-28.svg", "text": "ARS INCANTATIONUM\nAnno III · Settimana I\nDescendo\nLa direzione verso il basso\nDescendo viene studiato per governare un movimento verso il basso. La direzione generale non basta: l’allievo deve indicare quale bersaglio coinvolgere e dove il suo movimento debba terminare.\nIl confronto con Wingardium Leviosa distingue una guida nello spazio da un effetto orientato alla discesa. Il risultato va valutato rispetto al compito, senza dedurre dal nome dettagli non appresi.\nLa dimostrazione usa un oggetto inanimato e un punto di arrivo predisposto. Non si attribuiscono alla formula danni, altezze o intensità numeriche non documentate dal suo impiego in aula.\nObiettivo\nIl bersaglio e la direzione corrispondono al progetto.\nRiferimento: Catalogo della scuola; confronto con il libro madre, p. 10.", "title": "Descendo", "folio": "28", "kind": "theory"}, {"image": "pages/page-29.svg", "text": "ARS INCANTATIONUM\nAnno III · Lectio 1\nL’esercizio e il giudizio\nDescendo · Scheda operativa\nPreparazione\nOggetto didattico e superficie di arrivo predisposta.\n1. Definisci posizione iniziale e punto finale.\n2. Osserva Descendo sul bersaglio indicato.\n3. Confronta il movimento verso il basso con una deposizione guidata.\nControllo\nIl bersaglio e la direzione corrispondono al progetto.\nDomanda di ripasso\nDire “verso il basso” descrive già tutto il compito?\nRagionamento\nNo. Servono anche bersaglio, punto di arrivo e limite dell’effetto.", "title": "Descendo · Esercizio e ripasso", "folio": "29", "kind": "theory"}, {"image": "pages/page-30.svg", "text": "ARS INCANTATIONUM\nAnno III · Settimana I\nArresto Momentum\nOsservare un rallentamento\nArresto Momentum interviene sulla velocità di un bersaglio. Il compito iniziale riguarda un oggetto dal percorso prevedibile e richiede di distinguere il rallentamento osservato dall’arresto soltanto immaginato.\nIl movimento si descrive prima del tentativo: direzione, punto di partenza e zona nella quale verificare l’effetto rendono leggibile il confronto. La capacità di seguire il bersaglio conta quanto la formula.\nLe applicazioni più complesse verranno riprese negli anni successivi. La prova di oggi non estende automaticamente il controllo a persone, creature o più oggetti in movimento.\nObiettivo\nLo studente distingue rallentamento e arresto effettivo.\nRiferimento: Libro madre, p. 53; collocazione annuale proposta.", "title": "Arresto Momentum", "folio": "30", "kind": "theory"}, {"image": "pages/page-31.svg", "text": "ARS INCANTATIONUM\nAnno III · Lectio 2\nL’esercizio e il giudizio\nArresto Momentum · Scheda operativa\nPreparazione\nOggetto inanimato e percorso semplice predisposto.\n1. Osserva il movimento iniziale senza intervenire.\n2. Segui la dimostrazione di Arresto Momentum sul bersaglio.\n3. Descrivi se e come la velocità è cambiata.\nControllo\nLo studente distingue rallentamento e arresto effettivo.\nDomanda di ripasso\nUn bersaglio più lento è necessariamente fermo?\nRagionamento\nNo. Rallentamento e arresto completo sono risultati distinti.", "title": "Arresto Momentum · Esercizio e ripasso", "folio": "31", "kind": "theory"}, {"image": "pages/page-32.svg", "text": "ARS INCANTATIONUM\nAnno III · Settimana II\nSilencio\nIl silenziamento e il suo bersaglio\nSilencio riguarda la soppressione temporanea della voce del bersaglio. Si distingue da una semplice diminuzione del volume e non equivale alla scelta dell’incantatore di eseguire una formula senza voce.\nLa prova deve avere un bersaglio noto e un esito osservabile. Una mancata emissione non dimostra da sola l’assenza di ogni suono nell’ambiente: il controllo resta legato al soggetto sul quale si è intervenuti.\nLa lezione si svolge come dimostrazione guidata e confronto teorico. Prima di attribuire al risultato un silenziamento riuscito, si ricostruiscono le condizioni iniziali e il compito stabilito dal docente.\nObiettivo\nL’allievo distingue effetto sul bersaglio e silenzio generale.\nRiferimento: Libro madre, p. 22.", "title": "Silencio", "folio": "32", "kind": "theory"}, {"image": "pages/page-33.svg", "text": "ARS INCANTATIONUM\nAnno III · Lectio 3\nL’esercizio e il giudizio\nSilencio · Scheda operativa\nPreparazione\nCaso di dimostrazione e scheda delle condizioni iniziali.\n1. Descrivi il bersaglio e la voce che si intende influenzare.\n2. Osserva Silencio nella dimostrazione guidata.\n3. Distingui silenziamento del bersaglio, quiete dell’ambiente e magia non verbale.\nControllo\nL’allievo distingue effetto sul bersaglio e silenzio generale.\nDomanda di ripasso\nSilenziare un bersaglio significa eliminare tutti i rumori dell’ambiente?\nRagionamento\nNo. L’effetto studiato deve essere riferito al bersaglio designato.", "title": "Silencio · Esercizio e ripasso", "folio": "33", "kind": "theory"}, {"image": "pages/page-34.svg", "text": "ARS INCANTATIONUM\nAnno III · Settimana II\nIl percorso di un oggetto\nAccio, Depulso, Descendo e Wingardium Leviosa\nUna situazione di movimento può richiedere richiamo, allontanamento, discesa o guida. La scelta deve seguire il risultato necessario e non l’abitudine a usare sempre la stessa formula.\nIl caso conclusivo presenta un oggetto fuori posto e una destinazione precisa. Prima di agire si individua il percorso più leggibile e si scartano gli interventi superflui.\nLa quarta lezione conclude il terzo anno con una sequenza breve. Ogni effetto viene osservato prima di passare al successivo; concatenare formule senza riscontro rende difficile capire dove nasca un errore.\nObiettivo\nLa sequenza è proporzionata al compito e usa soltanto formule già studiate.\nRiferimento: Catalogo delle formule della scuola; attività didattica proposta.", "title": "Il percorso di un oggetto", "folio": "34", "kind": "theory"}, {"image": "pages/page-35.svg", "text": "ARS INCANTATIONUM\nAnno III · Lectio 4\nL’esercizio e il giudizio\nIl percorso di un oggetto · Scheda operativa\nPreparazione\nOggetto leggero e schema con più posizioni.\n1. Individua una sola destinazione.\n2. Scegli un incanto di movimento e motiva la scelta.\n3. Verifica il risultato prima di proporre un secondo intervento.\nControllo\nLa sequenza è proporzionata al compito e usa soltanto formule già studiate.\nDomanda di ripasso\nPiù formule rendono sempre migliore un percorso?\nRagionamento\nNo. Conta una scelta motivata, controllabile e sufficiente al compito.\nFine del ciclo di due settimane. Si prosegue con il IV anno.", "title": "Il percorso di un oggetto · Esercizio e ripasso", "folio": "35", "kind": "theory"}, {"image": "pages/page-36.svg", "text": "ARS INCANTATIONUM\nAnno IV\nGli elementi e la precisione\nAnnus Quartus\nConfrontare Incendio, Glacius, Ventus e Diffindo senza confondere intensità e riuscita.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Gli elementi e la precisione", "folio": "36", "kind": "divider"}, {"image": "pages/page-37.svg", "text": "ARS INCANTATIONUM\nAnno IV\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Incendio 38\nLa fiamma e il progetto\nLezione 2 · Glacius 40\nFreddo e cambiamento di stato\nSettimana II\nLezione 3 · Ventus 42\nDirezione e limite del vento\nLezione 4 · Diffindo 44\nIl taglio come prova di precisione\nTraguardo\nConfrontare Incendio, Glacius, Ventus e Diffindo senza confondere intensità e riuscita.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "37", "kind": "theory"}, {"image": "pages/page-38.svg", "text": "ARS INCANTATIONUM\nAnno IV · Settimana I\nIncendio\nLa fiamma e il progetto\nIncendio produce fuoco. Il suo studio prende avvio dalla destinazione dell’effetto e dal materiale sul quale la fiamma dovrà agire: l’apparizione non è l’unico criterio della riuscita.\nVanno considerate estensione, continuità e relazione con l’ambiente. La dimostrazione prepara anche la conclusione del compito e l’intervento del docente.\nIl laboratorio usa un punto predisposto per osservare una fiamma contenuta. Non si ampliano bersaglio e intensità per esibire potenza: l’obiettivo è conservare il limite concordato.\nObiettivo\nIl giudizio riguarda direzione, estensione e controllo, senza equiparare grandezza e riuscita.\nRiferimento: Libro madre, p. 27; programma di Incantesimi proposto per questa edizione.", "title": "Incendio", "folio": "38", "kind": "theory"}, {"image": "pages/page-39.svg", "text": "ARS INCANTATIONUM\nAnno IV · Lectio 1\nL’esercizio e il giudizio\nIncendio · Scheda operativa\nPreparazione\nPunto di dimostrazione predisposto dal docente; scheda del limite dell’effetto.\n1. Indica il solo punto nel quale è previsto l’effetto.\n2. Osserva l’incanto selezionato dal docente e descrivi l’estensione della fiamma.\n3. Confronta un effetto circoscritto con uno che supera il progetto.\nControllo\nIl giudizio riguarda direzione, estensione e controllo, senza equiparare grandezza e riuscita.\nDomanda di ripasso\nUna fiamma più grande del previsto è per questo un risultato migliore?\nRagionamento\nNo. Superare il limite assegnato costituisce una deviazione dal compito.", "title": "Incendio · Esercizio e ripasso", "folio": "39", "kind": "theory"}, {"image": "pages/page-40.svg", "text": "ARS INCANTATIONUM\nAnno IV · Settimana I\nGlacius\nFreddo e cambiamento di stato\nGlacius riguarda il raffreddamento e il congelamento del bersaglio. Il compito comincia dalla descrizione dello stato iniziale, così che l’allievo possa riconoscere che cosa è effettivamente cambiato.\nL’osservazione deve distinguere un cambiamento di stato dall’apparenza della superficie. Il confronto non attribuisce alla formula proprietà ulteriori soltanto perché il risultato sembra freddo.\nSi utilizza un piccolo campione predisposto. La conoscenza di Aguamenti, collocato in Trasfigurazione, può offrire un collegamento teorico ma non trasferisce quella formula nel programma di Incantesimi.\nObiettivo\nLo studente distingue il cambiamento osservato dalle proprietà soltanto supposte.\nRiferimento: Libro madre, p. 26.", "title": "Glacius", "folio": "40", "kind": "theory"}, {"image": "pages/page-41.svg", "text": "ARS INCANTATIONUM\nAnno IV · Lectio 2\nL’esercizio e il giudizio\nGlacius · Scheda operativa\nPreparazione\nCampione d’acqua, superficie didattica e scheda di confronto.\n1. Descrivi lo stato iniziale del campione.\n2. Osserva Glacius sul bersaglio predisposto dal docente.\n3. Confronta il campione con il suo stato precedente e indica il cambiamento osservabile.\nControllo\nLo studente distingue il cambiamento osservato dalle proprietà soltanto supposte.\nDomanda di ripasso\nL’apparenza di una superficie basta a descriverne ogni proprietà?\nRagionamento\nNo. Il giudizio deve precisare quali condizioni sono state verificate.", "title": "Glacius · Esercizio e ripasso", "folio": "41", "kind": "theory"}, {"image": "pages/page-42.svg", "text": "ARS INCANTATIONUM\nAnno IV · Settimana II\nVentus\nDirezione e limite del vento\nVentus produce un effetto di vento governato dalla bacchetta. La prova definisce una direzione e un bersaglio che permettano di osservare il movimento senza coinvolgere l’intero ambiente.\nL’intensità va riferita al compito: un indicatore che si muove nella direzione prevista offre un riscontro più chiaro di materiali dispersi senza controllo.\nIl laboratorio usa un oggetto inanimato leggero. Prima dell’esecuzione si controlla quali altri elementi potrebbero essere coinvolti; l’esito va confrontato sia con il bersaglio sia con ciò che doveva restare fermo.\nObiettivo\nLa direzione rispetta il progetto senza coinvolgere bersagli estranei.\nRiferimento: Libro madre, p. 26.", "title": "Ventus", "folio": "42", "kind": "theory"}, {"image": "pages/page-43.svg", "text": "ARS INCANTATIONUM\nAnno IV · Lectio 3\nL’esercizio e il giudizio\nVentus · Scheda operativa\nPreparazione\nIndicatore leggero e zona di lavoro sgombra.\n1. Definisci direzione e limite dell’effetto.\n2. Osserva o esegui Ventus sul bersaglio predisposto.\n3. Verifica anche gli oggetti che non dovevano essere coinvolti.\nControllo\nLa direzione rispetta il progetto senza coinvolgere bersagli estranei.\nDomanda di ripasso\nMuovere il bersaglio basta se vengono spostati anche oggetti non previsti?\nRagionamento\nNo. Il controllo include il rispetto dei limiti del progetto.", "title": "Ventus · Esercizio e ripasso", "folio": "43", "kind": "theory"}, {"image": "pages/page-44.svg", "text": "ARS INCANTATIONUM\nAnno IV · Settimana II\nDiffindo\nIl taglio come prova di precisione\nDiffindo separa o taglia il materiale bersagliato. Il compito preparatorio non è la recitazione della formula, ma la definizione di una linea e di un limite oltre il quale l’effetto non deve proseguire.\nLa precisione comprende il riconoscimento della superficie, il percorso del gesto e l’osservazione dell’esito. Un materiale separato in molti frammenti non dimostra una riuscita migliore se il progetto richiedeva una sola divisione.\nIl laboratorio usa esclusivamente un campione inanimato predisposto. La valutazione confronta il bordo ottenuto con il disegno iniziale: le parti rimaste integre contano quanto quelle separate.\nObiettivo\nIl taglio segue il compito assegnato e non modifica le parti da conservare.\nRiferimento: p. 36.", "title": "Diffindo", "folio": "44", "kind": "theory"}, {"image": "pages/page-45.svg", "text": "ARS INCANTATIONUM\nAnno IV · Lectio 4\nL’esercizio e il giudizio\nDiffindo · Scheda operativa\nPreparazione\nCampione didattico e linea di taglio concordata.\n1. Traccia sulla scheda la divisione prevista e le zone da conservare.\n2. Osserva o esegui Diffindo sul campione secondo la dimostrazione.\n3. Confronta il risultato con il progetto e individua eventuali deviazioni.\nControllo\nIl taglio segue il compito assegnato e non modifica le parti da conservare.\nDomanda di ripasso\nIl materiale è stato separato, ma lungo una linea diversa: il compito è riuscito?\nRagionamento\nNon pienamente. La separazione deve corrispondere anche al percorso previsto.\nFine del ciclo di due settimane. Si prosegue con il V anno.", "title": "Diffindo · Esercizio e ripasso", "folio": "45", "kind": "theory"}, {"image": "pages/page-46.svg", "text": "ARS INCANTATIONUM\nAnno V\nControllo intermedio\nAnnus Quintus\nAffrontare Alohomora di livello 2 e revisioni ragionate delle formule apprese.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Controllo intermedio", "folio": "46", "kind": "divider"}, {"image": "pages/page-47.svg", "text": "ARS INCANTATIONUM\nAnno V\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Alohomora · livello 2 48\nUna progressione documentata, non un effetto inventato\nLezione 2 · Accio e Depulso · revisione 50\nScegliere il movimento più adatto\nSettimana II\nLezione 3 · Diffindo e Reparo · revisione 52\nSeparare e ricomporre non sono la stessa operazione\nLezione 4 · Lavorare nello spazio 54\nLevioso, Wingardium Leviosa e Descendo\nTraguardo\nAffrontare Alohomora di livello 2 e revisioni ragionate delle formule apprese.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "47", "kind": "theory"}, {"image": "pages/page-48.svg", "text": "ARS INCANTATIONUM\nAnno V · Settimana I\nAlohomora · livello 2\nUna progressione documentata, non un effetto inventato\nIl catalogo distingue Alohomora di base dal livello 2. Questa lezione tratta il secondo livello come progressione della formula d’apertura, senza dedurre dal nome un successo garantito su qualsiasi chiusura.\nIl bersaglio viene scelto dal docente in base alle condizioni effettivamente previste per il livello. L’allievo descrive l’apertura richiesta e confronta il caso con una chiusura già affrontata.\nNon si inventano tempi, costi o caratteristiche della serratura. La riuscita riguarda il compito predisposto e non dimostra che l’incantatore possa superare ogni protezione.\nObiettivo\nLa verifica riguarda la progressione documentata, senza promesse universali.\nRiferimento: Catalogo della scuola, Alohomora (livello 2); teoria d’apertura nel libro madre, pp. 8–9.", "title": "Alohomora · livello 2", "folio": "48", "kind": "theory"}, {"image": "pages/page-49.svg", "text": "ARS INCANTATIONUM\nAnno V · Lectio 1\nL’esercizio e il giudizio\nAlohomora · livello 2 · Scheda operativa\nPreparazione\nChiusura didattica indicata per Alohomora di livello 2.\n1. Ricostruisci il compito già affrontato con la formula di base.\n2. Osserva o esegui il livello 2 sul bersaglio autorizzato.\n3. Indica il risultato e ciò che non puoi estendere ad altre protezioni.\nControllo\nLa verifica riguarda la progressione documentata, senza promesse universali.\nDomanda di ripasso\nIl livello 2 garantisce l’apertura di qualsiasi protezione?\nRagionamento\nNo. Il livello non elimina le condizioni del bersaglio.", "title": "Alohomora · livello 2 · Esercizio e ripasso", "folio": "49", "kind": "theory"}, {"image": "pages/page-50.svg", "text": "ARS INCANTATIONUM\nAnno V · Settimana I\nAccio e Depulso · revisione\nScegliere il movimento più adatto\nLa revisione confronta richiamo e allontanamento sullo stesso oggetto in due prove distinte. Il progetto deve mantenere espliciti origine, percorso e destinazione.\nLa maggiore preparazione non richiede una maggiore intensità: permette invece di motivare meglio quale delle due formule sia sufficiente al compito.\nI tentativi restano separati. Si attende il riscontro del primo prima di predisporre il secondo, così che una deviazione non venga nascosta da un intervento successivo.\nObiettivo\nLa scelta è motivata dal percorso e dalla destinazione.\nRiferimento: Revisione di Accio e Depulso; libro madre, pp. 13–14.", "title": "Accio e Depulso · revisione", "folio": "50", "kind": "theory"}, {"image": "pages/page-51.svg", "text": "ARS INCANTATIONUM\nAnno V · Lectio 2\nL’esercizio e il giudizio\nAccio e Depulso · revisione · Scheda operativa\nPreparazione\nOggetto e due destinazioni segnate.\n1. Progetta un richiamo e un allontanamento distinti.\n2. Confronta le prove guidate di Accio e Depulso.\n3. Spiega quale scegliere in un nuovo caso scritto.\nControllo\nLa scelta è motivata dal percorso e dalla destinazione.\nDomanda di ripasso\nUna formula più energica è necessariamente più adeguata?\nRagionamento\nNo. L’adeguatezza dipende dal compito.", "title": "Accio e Depulso · revisione · Esercizio e ripasso", "folio": "51", "kind": "theory"}, {"image": "pages/page-52.svg", "text": "ARS INCANTATIONUM\nAnno V · Settimana II\nDiffindo e Reparo · revisione\nSeparare e ricomporre non sono la stessa operazione\nDiffindo e Reparo consentono di confrontare due compiti sul materiale: una separazione prevista e una ricomposizione rispetto a uno stato conosciuto.\nIl progetto iniziale deve documentare la forma dell’oggetto. Una ricomposizione soltanto apparente non dimostra il ritorno di ogni funzione, soprattutto quando il supporto è complesso.\nLa classe lavora su un campione ordinario predisposto. Le due prove vengono confrontate senza presentare Reparo come rimedio universale a qualsiasi taglio o danno.\nObiettivo\nIl giudizio distingue taglio, ricostruzione e proprietà non verificate.\nRiferimento: Libro madre, pp. 15–16 e 36.", "title": "Diffindo e Reparo · revisione", "folio": "52", "kind": "theory"}, {"image": "pages/page-53.svg", "text": "ARS INCANTATIONUM\nAnno V · Lectio 3\nL’esercizio e il giudizio\nDiffindo e Reparo · revisione · Scheda operativa\nPreparazione\nCampione ordinario e disegno della struttura iniziale.\n1. Definisci una separazione e la forma da recuperare.\n2. Osserva le due operazioni nelle condizioni stabilite dal docente.\n3. Confronta forma, parti conservate e funzione ordinaria.\nControllo\nIl giudizio distingue taglio, ricostruzione e proprietà non verificate.\nDomanda di ripasso\nReparo è automaticamente la soluzione a ogni danno?\nRagionamento\nNo. Il tipo di oggetto e la natura del danno restano determinanti.", "title": "Diffindo e Reparo · revisione · Esercizio e ripasso", "folio": "53", "kind": "theory"}, {"image": "pages/page-54.svg", "text": "ARS INCANTATIONUM\nAnno V · Settimana II\nLavorare nello spazio\nLevioso, Wingardium Leviosa e Descendo\nLe tre formule vengono confrontate per distinguere sospensione, guida e discesa. L’allievo deve descrivere la necessità prima di scegliere il nome dell’incanto.\nUn percorso efficace non richiede necessariamente tutte e tre le formule. Lo studio riguarda anche gli interventi che si possono evitare perché il compito è già risolto.\nLa quarta lezione del quinto anno propone un caso nuovo su un oggetto noto. La soluzione viene motivata e verificata, senza attribuire capacità automatiche a bersagli più complessi.\nObiettivo\nLa formula scelta corrisponde al problema di movimento.\nRiferimento: Catalogo delle formule della scuola; attività didattica proposta.", "title": "Lavorare nello spazio", "folio": "54", "kind": "theory"}, {"image": "pages/page-55.svg", "text": "ARS INCANTATIONUM\nAnno V · Lectio 4\nL’esercizio e il giudizio\nLavorare nello spazio · Scheda operativa\nPreparazione\nSchema di un percorso e oggetto semplice.\n1. Definisci l’unico problema da risolvere.\n2. Scegli sospensione, guida o discesa motivando la scelta.\n3. Descrivi un controllo che permetta al docente di giudicare il risultato.\nControllo\nLa formula scelta corrisponde al problema di movimento.\nDomanda di ripasso\nDevi usare tutte le formule conosciute per dimostrare competenza?\nRagionamento\nNo. La competenza comprende evitare gli interventi superflui.\nFine del ciclo di due settimane. Si prosegue con il VI anno.", "title": "Lavorare nello spazio · Esercizio e ripasso", "folio": "55", "kind": "theory"}, {"image": "pages/page-56.svg", "text": "ARS INCANTATIONUM\nAnno VI\nControllo avanzato\nAnnus Sextus\nStudiare Alohomora di livello 3, precisione, continuità e preparazione non verbale.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Controllo avanzato", "folio": "56", "kind": "divider"}, {"image": "pages/page-57.svg", "text": "ARS INCANTATIONUM\nAnno VI\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Alohomora · livello 3 58\nConfrontare i tre livelli di apertura\nLezione 2 · Silencio · revisione avanzata 60\nIsolare il bersaglio nell’osservazione\nSettimana II\nLezione 3 · Gli elementi · revisione 62\nIncendio, Glacius e Ventus\nLezione 4 · La magia non verbale 64\nStudio teorico su formule già conosciute\nTraguardo\nStudiare Alohomora di livello 3, precisione, continuità e preparazione non verbale.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "57", "kind": "theory"}, {"image": "pages/page-58.svg", "text": "ARS INCANTATIONUM\nAnno VI · Settimana I\nAlohomora · livello 3\nConfrontare i tre livelli di apertura\nIl livello 3 è la terza voce di Alohomora presente nel catalogo. Il suo studio riprende la distinzione fra formula, condizioni della chiusura e risultato osservabile.\nL’allievo ricostruisce i casi già affrontati prima di passare al bersaglio avanzato indicato dal docente. La progressione non autorizza a definire ogni protezione equivalente a una serratura ordinaria.\nLa lezione conserva le condizioni effettivamente insegnate per il livello 3 e non aggiunge caratteristiche mancanti. Anche un risultato positivo va riferito al bersaglio sul quale è stato verificato.\nObiettivo\nLo studente distingue i livelli senza estenderli a ogni protezione.\nRiferimento: Catalogo della scuola, Alohomora (livello 3); libro madre, pp. 8–9.", "title": "Alohomora · livello 3", "folio": "58", "kind": "theory"}, {"image": "pages/page-59.svg", "text": "ARS INCANTATIONUM\nAnno VI · Lectio 1\nL’esercizio e il giudizio\nAlohomora · livello 3 · Scheda operativa\nPreparazione\nChiusura didattica assegnata al livello 3.\n1. Confronta base e livello 2 attraverso le schede precedenti.\n2. Osserva la dimostrazione o prova autorizzata del livello 3.\n3. Spiega quali condizioni del risultato possono essere generalizzate e quali no.\nControllo\nLo studente distingue i livelli senza estenderli a ogni protezione.\nDomanda di ripasso\nIl terzo livello elimina la necessità di riconoscere il bersaglio?\nRagionamento\nNo. L’identificazione della chiusura resta parte del compito.", "title": "Alohomora · livello 3 · Esercizio e ripasso", "folio": "59", "kind": "theory"}, {"image": "pages/page-60.svg", "text": "ARS INCANTATIONUM\nAnno VI · Settimana I\nSilencio · revisione avanzata\nIsolare il bersaglio nell’osservazione\nLa revisione di Silencio precisa la relazione fra bersaglio e suoni dell’ambiente. Il risultato non deve essere attribuito a soggetti che non sono stati coinvolti.\nLa maggiore preparazione permette una descrizione più accurata del prima e del dopo. Il silenzio momentaneo va distinto dal mancato tentativo di emettere un suono.\nSi lavora su un caso di dimostrazione autorizzato. Il giudizio deve dichiarare se l’osservazione è sufficiente o se occorre un ulteriore riscontro del docente.\nObiettivo\nIl giudizio delimita bersaglio e portata dell’osservazione.\nRiferimento: Revisione di Silencio; libro madre, p. 22.", "title": "Silencio · revisione avanzata", "folio": "60", "kind": "theory"}, {"image": "pages/page-61.svg", "text": "ARS INCANTATIONUM\nAnno VI · Lectio 2\nL’esercizio e il giudizio\nSilencio · revisione avanzata · Scheda operativa\nPreparazione\nCaso sonoro predisposto e scheda delle condizioni.\n1. Documenta le condizioni iniziali.\n2. Osserva il bersaglio designato e distinguilo dall’ambiente.\n3. Segnala ciò che è dimostrato e ciò che resta incerto.\nControllo\nIl giudizio delimita bersaglio e portata dell’osservazione.\nDomanda di ripasso\nUn ambiente quieto dimostra che ogni soggetto sia silenziato?\nRagionamento\nNo. La quiete generale non prova l’effetto su ogni bersaglio.", "title": "Silencio · revisione avanzata · Esercizio e ripasso", "folio": "61", "kind": "theory"}, {"image": "pages/page-62.svg", "text": "ARS INCANTATIONUM\nAnno VI · Settimana II\nGli elementi · revisione\nIncendio, Glacius e Ventus\nIl confronto riguarda tre effetti distinti: fiamma, freddo e vento. La scelta nasce dal compito e non dall’idea che gli elementi possano sempre annullarsi fra loro.\nIl progetto deve specificare bersaglio e limite di ciascuna prova. Non si concatenano effetti sulla base della sola fantasia, né si inventano bonus risultanti dalla loro combinazione.\nLa classe analizza casi separati e una dimostrazione selezionata dal docente. Il riscontro più importante è la coerenza fra l’intervento scelto e ciò che doveva essere ottenuto.\nObiettivo\nL’allievo non attribuisce proprietà nuove alla semplice successione di incanti.\nRiferimento: Revisione degli elementi; libro madre, pp. 26–27.", "title": "Gli elementi · revisione", "folio": "62", "kind": "theory"}, {"image": "pages/page-63.svg", "text": "ARS INCANTATIONUM\nAnno VI · Lectio 3\nL’esercizio e il giudizio\nGli elementi · revisione · Scheda operativa\nPreparazione\nTre casi scritti e un bersaglio di dimostrazione.\n1. Identifica quale effetto richiede ogni caso.\n2. Scegli una formula fra quelle studiate.\n3. Descrivi i limiti e scarta combinazioni prive di riscontro.\nControllo\nL’allievo non attribuisce proprietà nuove alla semplice successione di incanti.\nDomanda di ripasso\nCombinare due elementi garantisce un effetto migliore?\nRagionamento\nNo. Ogni combinazione deve essere conosciuta e verificata.", "title": "Gli elementi · revisione · Esercizio e ripasso", "folio": "63", "kind": "theory"}, {"image": "pages/page-64.svg", "text": "ARS INCANTATIONUM\nAnno VI · Settimana II\nLa magia non verbale\nStudio teorico su formule già conosciute\nLa magia non verbale esegue un incanto senza pronunciarne ad alta voce la formula. Non consiste nell’assenza di intenzione, né nel muovere la bacchetta sperando che l’effetto si produca da solo.\nIl riferimento propone di partire da incanti semplici già conosciuti. La nuova difficoltà riguarda la disciplina mentale e la continuità del progetto: saper eseguire una formula verbalmente non dimostra subito la stessa padronanza senza voce.\nLa lezione usa Lumos come riferimento teorico, soltanto secondo la preparazione riconosciuta dal docente. Non introduce nuove formule: distingue il modo di esecuzione dalla padronanza effettivamente verificata.\nObiettivo\nLo studente distingue silenzio, progetto mentale e riuscita osservabile.\nRiferimento: pp. 40–41.", "title": "La magia non verbale", "folio": "64", "kind": "theory"}, {"image": "pages/page-65.svg", "text": "ARS INCANTATIONUM\nAnno VI · Lectio 4\nL’esercizio e il giudizio\nLa magia non verbale · Scheda operativa\nPreparazione\nIncanto semplice già padroneggiato e scheda di confronto fra due esecuzioni.\n1. Ricostruisci intenzione e gesto di Lumos senza eseguire il tentativo.\n2. Confronta la dimostrazione verbale con quella non verbale.\n3. Indica quali elementi di controllo devono restare presenti anche senza voce.\nControllo\nLo studente distingue silenzio, progetto mentale e riuscita osservabile.\nDomanda di ripasso\nNon pronunciare parole rende un incantesimo automaticamente più potente?\nRagionamento\nNo. La magia non verbale introduce una difficoltà ulteriore e non garantisce un potenziamento.\nFine del ciclo di due settimane. Si prosegue con il VII anno.", "title": "La magia non verbale · Esercizio e ripasso", "folio": "65", "kind": "theory"}, {"image": "pages/page-66.svg", "text": "ARS INCANTATIONUM\nAnno VII\nIl giudizio dell’incantatore\nAnnus Septimus\nRisolvere compiti complessi con le formule di Incantesimi, rispettando i confini delle altre materie.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri prima del passaggio all’anno successivo.", "title": "Il giudizio dell’incantatore", "folio": "66", "kind": "divider"}, {"image": "pages/page-67.svg", "text": "ARS INCANTATIONUM\nAnno VII\nIl programma dell’anno\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Arresto Momentum · revisione avanzata 68\nLeggere il movimento prima di intervenire\nLezione 2 · Wingardium Leviosa · revisione avanzata 70\nUn percorso preciso, senza scorciatoie\nSettimana II\nLezione 3 · Progettare una sequenza 72\nLe formule della materia e i suoi confini\nLezione 4 · Il giudizio dell’incantatore 74\nUna scelta motivata, dal principio alla conclusione\nTraguardo\nRisolvere compiti complessi con le formule di Incantesimi, rispettando i confini delle altre materie.\nLeggere la teoria, preparare il compito e confrontare il risultato. La quarta lezione chiude il ciclo e raccoglie il ripasso dell’annualità.", "title": "Il programma dell’anno", "folio": "67", "kind": "theory"}, {"image": "pages/page-68.svg", "text": "ARS INCANTATIONUM\nAnno VII · Settimana I\nArresto Momentum · revisione avanzata\nLeggere il movimento prima di intervenire\nLa revisione introduce un caso più articolato di movimento, mantenendo un solo bersaglio inanimato. L’obiettivo è descrivere con prontezza il cambiamento di velocità.\nLa scelta del momento deve essere motivata rispetto al percorso. La maggiore complessità non consiste nell’attribuire alla formula poteri nuovi, ma nel controllare meglio le condizioni della prova.\nIl caso si conclude confrontando il rallentamento osservato con il risultato previsto. Solo il docente stabilisce se la preparazione consenta ulteriori applicazioni.\nObiettivo\nLa previsione del movimento è coerente e verificabile.\nRiferimento: Libro madre, p. 53.", "title": "Arresto Momentum · revisione avanzata", "folio": "68", "kind": "theory"}, {"image": "pages/page-69.svg", "text": "ARS INCANTATIONUM\nAnno VII · Lectio 1\nL’esercizio e il giudizio\nArresto Momentum · revisione avanzata · Scheda operativa\nPreparazione\nOggetto inanimato e percorso di dimostrazione.\n1. Descrivi il percorso prima dell’intervento.\n2. Individua il momento nel quale verificare il rallentamento.\n3. Confronta previsione ed esito senza estenderlo ad altri bersagli.\nControllo\nLa previsione del movimento è coerente e verificabile.\nDomanda di ripasso\nUn tentativo riuscito su un oggetto dimostra padronanza su ogni bersaglio?\nRagionamento\nNo. Bersagli e condizioni differenti richiedono verifiche proprie.", "title": "Arresto Momentum · revisione avanzata · Esercizio e ripasso", "folio": "69", "kind": "theory"}, {"image": "pages/page-70.svg", "text": "ARS INCANTATIONUM\nAnno VII · Settimana I\nWingardium Leviosa · revisione avanzata\nUn percorso preciso, senza scorciatoie\nLa guida avanzata riprende Wingardium Leviosa su un percorso più articolato predisposto dal docente. La difficoltà cresce nella precisione richiesta, non in un aumento arbitrario dei poteri della formula.\nIl progetto conserva punti di passaggio, appoggi e destinazione. L’allievo deve scegliere quando correggere la traiettoria e quando interrompere una prova che non rispetta il compito.\nNon si estende la riuscita a persone o creature. Il confronto resta legato all’oggetto e alle condizioni realmente affrontate durante l’esercitazione.\nObiettivo\nIl percorso è rispettato e le correzioni mantengono il controllo.\nRiferimento: Libro madre, pp. 9–10; approfondimento didattico.", "title": "Wingardium Leviosa · revisione avanzata", "folio": "70", "kind": "theory"}, {"image": "pages/page-71.svg", "text": "ARS INCANTATIONUM\nAnno VII · Lectio 2\nL’esercizio e il giudizio\nWingardium Leviosa · revisione avanzata · Scheda operativa\nPreparazione\nOggetto e percorso didattico con punti di passaggio.\n1. Descrivi partenza, passaggi e arrivo.\n2. Segui una prova guidata di levitazione.\n3. Valuta la precisione e individua una correzione motivata.\nControllo\nIl percorso è rispettato e le correzioni mantengono il controllo.\nDomanda di ripasso\nUn oggetto più pesante dimostra da solo maggiore precisione?\nRagionamento\nNo. Precisione e peso non sono lo stesso criterio.", "title": "Wingardium Leviosa · revisione avanzata · Esercizio e ripasso", "folio": "71", "kind": "theory"}, {"image": "pages/page-72.svg", "text": "ARS INCANTATIONUM\nAnno VII · Settimana II\nProgettare una sequenza\nLe formule della materia e i suoi confini\nUn compito complesso può richiedere più interventi, ma ogni passaggio deve essere motivato. La sequenza non diventa un nuovo incantesimo soltanto perché le formule sono eseguite una dopo l’altra.\nIl progetto utilizza esclusivamente gli incanti di questa materia. Quando il caso richiede guarigione, difesa specialistica o trasformazione dei parametri della materia, si riconosce il confine e si coinvolge il docente competente.\nLa prova è progettuale e non promette incantamenti permanenti o abilità speciali. La preparazione si misura anche nella capacità di dichiarare ciò che non può essere risolto con le formule scelte.\nObiettivo\nIl progetto distingue sequenza, formula e competenza delle altre materie.\nRiferimento: Catalogo delle formule della scuola; attività didattica proposta.", "title": "Progettare una sequenza", "folio": "72", "kind": "theory"}, {"image": "pages/page-73.svg", "text": "ARS INCANTATIONUM\nAnno VII · Lectio 3\nL’esercizio e il giudizio\nProgettare una sequenza · Scheda operativa\nPreparazione\nCaso scritto e tavola delle assegnazioni per materia.\n1. Individua il compito e l’ordine degli interventi.\n2. Scegli soltanto formule del programma di Incantesimi.\n3. Segnala il punto nel quale servirebbe un’altra competenza.\nControllo\nIl progetto distingue sequenza, formula e competenza delle altre materie.\nDomanda di ripasso\nConoscere molti incanti elimina i confini fra le materie?\nRagionamento\nNo. Ogni intervento deve rispettare competenze e assegnazioni.", "title": "Progettare una sequenza · Esercizio e ripasso", "folio": "73", "kind": "theory"}, {"image": "pages/page-74.svg", "text": "ARS INCANTATIONUM\nAnno VII · Settimana II\nIl giudizio dell’incantatore\nUna scelta motivata, dal principio alla conclusione\nLa padronanza non consiste nel scegliere sempre la formula più complessa. Un intervento adeguato nasce dalla lettura della situazione, da un obiettivo limitato e da una previsione del modo in cui si controllerà l’esito.\nIl caso conclusivo presenta un ambiente con scarsa luce, un oggetto fuori posto e un compito di recupero. Lumos, un incanto di movimento e un eventuale ripristino devono essere scelti in ordine, distinguendo ciò che si sa da ciò che richiede l’intervento del docente.\nL’ultima lezione raccoglie sette annualità e ventotto incontri. È un ripasso ragionato, non un esame finale. Le schede restano disponibili per recuperare le lezioni e rivedere un metodo che accompagna ogni nuova formula.\nObiettivo\nLa soluzione è coerente, proporzionata e distingue conoscenza, esecuzione ed esito verificato.\nRiferimento: Sintesi didattica originale del percorso; fondamenti pp. 4–7 e 52.", "title": "Il giudizio dell’incantatore", "folio": "74", "kind": "theory"}, {"image": "pages/page-75.svg", "text": "ARS INCANTATIONUM\nAnno VII · Lectio 4\nL’esercizio e il giudizio\nIl giudizio dell’incantatore · Scheda operativa\nPreparazione\nCaso scritto predisposto dal docente e schede degli incanti studiati.\n1. Individua il problema senza lanciare formule e scegli un solo obiettivo iniziale.\n2. Ordina gli interventi necessari e motiva perché gli altri sarebbero superflui.\n3. Descrivi il controllo finale e segnala esplicitamente ciò che non sei in grado di risolvere.\nControllo\nLa soluzione è coerente, proporzionata e distingue conoscenza, esecuzione ed esito verificato.\nDomanda di ripasso\nLa soluzione migliore è sempre quella che impiega più incantesimi?\nRagionamento\nNo. È quella che raggiunge il compito con interventi motivati, controllabili e commisurati alla preparazione.\nFine del ciclo di due settimane. Il percorso dei sette anni è concluso.", "title": "Il giudizio dell’incantatore · Esercizio e ripasso", "folio": "75", "kind": "theory"}, {"image": "pages/page-76.svg", "text": "ARS INCANTATIONUM\nLexicon\nIl lessico dell’incantatore\nParole da usare con precisione\nBersaglio\nSoggetto identificato sul quale si intende intervenire.\nFormula e gesto\nElementi appresi dell’esecuzione, da distinguere dal risultato osservato.\nControincantesimo\nIntervento sull’effetto di un incanto. Non coincide con ogni effetto apparentemente opposto.\nIncantamento\nProgetto magico apposto a un oggetto, da verificare per compito e mantenimento.\nMagia non verbale\nEsecuzione senza formula pronunciata; richiede comunque intenzione e disciplina.\nRiuscita e potenza\nUn effetto più grande non è automaticamente più adatto. Conta la corrispondenza con il compito assegnato.", "title": "Il lessico dell’incantatore", "folio": "76", "kind": "theory"}, {"image": "pages/page-77.svg", "text": "ARS INCANTATIONUM\nTavola I · Incantesimi\nLe formule per anno\nPrima introduzione · Ordinamento della presente edizione\nLe revisioni negli anni successivi approfondiscono formule già introdotte. Le assegnazioni non già stabilite dalla scuola sono proposte didattiche di questo volume.\nLumos I\nVerdimilius I\nLevioso I\nWingardium Leviosa I\nAlohomora II\nColloportus II\nAccio II\nDepulso II\nReparo II\nDescendo III\nArresto Momentum III\nSilencio III\nIncendio IV\nGlacius IV\nVentus IV\nDiffindo IV\nAlohomora (livello 2) V\nAlohomora (livello 3) VI", "title": "Le formule per anno", "folio": "77", "kind": "theory"}, {"image": "pages/page-78.svg", "text": "ARS INCANTATIONUM\nTavola II · D.C.A.O.\nDifesa contro le Arti Oscure\nFormule tenute fuori dal programma di Incantesimi\nProtego, Flipendo e Rictusempra conservano il primo anno già assegnato. Per le altre voci, anno e materia indicano una proposta didattica.\nProtego I\nFlipendo I\nRictusempra I\nExpelliarmus II\nEverte Statum II\nTarantallegra II\nPetrificus III\nColloshoo III\nRiddikulus III\nExpulso IV\nConfringo IV\nConfundo V\nFireball V\nObliviate VI\nExpecto Patronum VII\nLa presenza in questa tavola non costituisce insegnamento operativo della formula. Le lezioni appartengono alla materia indicata.", "title": "Difesa contro le Arti Oscure", "folio": "78", "kind": "theory"}, {"image": "pages/page-79.svg", "text": "ARS INCANTATIONUM\nTavola III · Altre discipline\nMaterie e confini\nLa competenza precede l’esecuzione\nTrasfigurazione\nAguamenti I\nEngorgio IV\nReducio IV\nIncarcerous V\nMedimagia\nEpiskey III\nFormula da assegnare\nBlink: funzione e materia non sono determinate dalla documentazione ricevuta. Non viene attribuito un anno né predisposta una lezione pratica.\nCriterio editoriale\nAguamenti conserva il primo anno di Trasfigurazione già stabilito. Gli altri anni non confermati sono proposte di ordinamento. Le denominazioni seguono il catalogo della scuola; le formule delle altre discipline non vengono impartite come Incantesimi.\nBase teorica: Manuale Ufficiale di Incantesimi di bewitchedgdr. Catalogo aggiornato delle formule fornito dalla scuola. Attività e piano didattico rielaborati per questa edizione.", "title": "Materie e confini", "folio": "79", "kind": "theory"}, {"image": "pages/page-80.svg", "text": "ARS INCANTATIONUM\nFinis\nLa volontà guida.\nIl metodo governa.\nSette annualità. Quattordici settimane. Ventotto lezioni per collegare conoscenza, intenzione e giudizio.\nEdmund Valemont\nHogwarts · MDCCCXC", "title": "La volontà guida.", "folio": "80", "kind": "theory"}, {"ima
